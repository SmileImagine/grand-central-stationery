<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practice Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)">
  <link href="../fonts/fonts.css" rel="stylesheet">
  <script src="../vendor/abcjs-basic-min.js" defer></script>
  <style>
    /*
      The practice board: the current set of tunes, graded into levels.

      A student picks their name and sees their level: the tunes there to
      choose from, each with its opening bars and what it brings in, a
      Practise button that puts it on their list, Open to play it in the
      main page, and Ready to show when they want to perform it.

      The teacher view shows every level as a wall of cards, a queue of
      students who are ready to show a tune, and marks passes. A level is
      done once half its tunes are passed, and the next one opens.

      Each student's tunes carry one state: practising, ready, passed.
      Nothing leaves the browser; Export and Import move it between computers.
    */
    :root {
      --font: 'Atkinson Hyperlegible', system-ui, sans-serif;
      --ink: #222; --bg: #fff; --panel: #fafafa; --panel-2: #fff; --line: #ddd; --line-2: #eee; --muted: #777;
      --accent: #087fca; --pass: #69b944; --ready: #e0b800; --prac: #087fca;
      --l1: #69b944; --l2: #e0b800; --l3: #f39322; --l4: #e72829; --l5: #087fca; --l6: #79569f;
    }
    :root[data-theme="dark"] { --ink: #e8e8e8; --bg: #1b1b1b; --panel: #232323; --panel-2: #2a2a2a; --line: #3a3a3a; --line-2: #333; --muted: #9a9a9a; --accent: #4fa8e8; --prac: #4fa8e8; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #e8e8e8; --bg: #1b1b1b; --panel: #232323; --panel-2: #2a2a2a; --line: #3a3a3a; --line-2: #333; --muted: #9a9a9a; --accent: #4fa8e8; --prac: #4fa8e8; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
    body { padding: 0 16px 40px; }
    button, select, input, textarea { font: inherit; color: inherit; }
    button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.pass { background: var(--pass); border-color: var(--pass); color: #fff; }
    button.ready { background: var(--ready); border-color: var(--ready); color: #222; }
    button.quiet { border-color: transparent; background: transparent; color: var(--muted); }
    select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
    a { color: var(--accent); }

    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 0 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 3; }
    header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
    header h1 small { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 8px; }
    header .spacer { flex: 1; }
    header label { color: var(--muted); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
    #theme { width: 36px; padding: 6px 0; }

    .summary { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 0 0 10px; color: var(--muted); font-size: 14px; min-height: 30px; }
    .summary .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); background: var(--panel); }
    .summary .pill i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .summary .pill.done { border-color: var(--pass); }
    .summary .lead { font-weight: 700; color: var(--ink); }

    /* ---- the student's page ---- */
    .me section { margin-top: 18px; }
    .me h2 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .me h2 .tape { width: 14px; height: 26px; border-radius: 3px; transform: skewX(-12deg); display: inline-block; }
    .me h2 small { font-weight: 400; color: var(--muted); font-size: 14px; }
    .me .hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; line-height: 1.4; }
    .me .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
    .me details { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 8px 12px; margin-top: 14px; }
    .me details summary { cursor: pointer; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; padding: 4px 0; }
    .me details summary .tape { width: 14px; height: 26px; border-radius: 3px; transform: skewX(-12deg); display: inline-block; }
    .me details summary small { font-weight: 400; color: var(--muted); font-size: 14px; }
    .me details .cards { padding: 8px 0 6px; }
    .me details .hint { margin-top: 6px; }

    /* ---- the teacher's wall ---- */
    .queue { margin-top: 14px; border: 1px solid var(--ready); border-radius: 14px; background: color-mix(in srgb, var(--ready) 8%, var(--panel)); padding: 10px 12px; }
    .queue h2 { font-size: 16px; margin: 0 0 6px; }
    .queue .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); }
    .queue .row:first-of-type { border-top: 0; }
    .queue .row .what { flex: 1; min-width: 180px; }
    .queue .row .what small { color: var(--muted); margin-left: 6px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; margin: 12px 0 0; align-items: center; }
    .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: -1px; border: 2px solid transparent; }
    .wall { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; padding-top: 10px; align-items: start; }
    .col { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
    .col h2 { margin: 2px 4px 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .col h2 .tape { width: 14px; height: 26px; border-radius: 3px; transform: skewX(-12deg); display: inline-block; }
    .col h2 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: auto; }
    .col .rungs { font-size: 12px; color: var(--muted); margin: -4px 4px 10px; line-height: 1.35; }
    .empty { color: var(--muted); font-size: 13px; padding: 10px 4px; font-style: italic; }

    /* ---- a tune card, in either view ---- */
    .tune { background: var(--panel-2); border: 1px solid var(--line); border-left: 6px solid var(--lvl); border-radius: 10px; padding: 8px 10px 8px 10px; margin-bottom: 10px; }
    .cards .tune { margin-bottom: 0; }
    .tune.passed { border-color: var(--pass); border-left-color: var(--pass); background: color-mix(in srgb, var(--pass) 10%, var(--panel-2)); }
    .tune.ready { border-color: var(--ready); border-left-color: var(--ready); background: color-mix(in srgb, var(--ready) 10%, var(--panel-2)); }
    .tune.practising { border-color: var(--prac); border-left-color: var(--prac); }
    .tune .top { display: flex; align-items: baseline; gap: 8px; }
    .tune h3 { font-size: 15px; margin: 0; flex: 1; line-height: 1.25; }
    .tune .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .tune .incipit { margin: 4px -4px 0; min-height: 44px; overflow: hidden; }
    .tune .incipit svg { color: var(--ink); max-width: 100%; height: auto; }
    .tune .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
    .tune .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 7px; }
    .tune .tag.new { color: var(--ink); border-color: var(--lvl); }
    .tune .tag.grade { color: var(--ink); background: var(--panel); }
    .tune .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .tune .actions .state { margin-left: auto; font-size: 13px; color: var(--muted); }
    .tune .actions .state b { color: var(--ink); }
    .tune .who { display: none; flex-wrap: wrap; gap: 6px; padding-top: 8px; margin-top: 8px; border-top: 1px dashed var(--line); }
    .tune.open .who { display: flex; }
    .chip { border-radius: 999px; padding: 3px 10px; font-size: 13px; }
    .chip.practising { border-color: var(--prac); color: var(--prac); }
    .chip.ready { background: var(--ready); border-color: var(--ready); color: #222; }
    .chip.passed { background: var(--pass); border-color: var(--pass); color: #fff; }
    .nobody { font-size: 13px; color: var(--muted); }

    dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 18px; max-width: 460px; width: calc(100vw - 32px); }
    dialog::backdrop { background: rgba(0,0,0,0.35); }
    dialog h2 { margin: 0 0 6px; font-size: 18px; }
    dialog p { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
    dialog textarea { width: 100%; min-height: 160px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
    dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
    dialog .row .left { margin-right: auto; display: flex; gap: 8px; }
    #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    #toast.on { opacity: 1; }
    @media (max-width: 700px) { header { position: static; } header h1 small { display: block; margin: 2px 0 0; } .tune .meta { white-space: normal; } .me .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1><a href="../index.html" title="Back to the main page" style="color:inherit;text-decoration:none">&larr;</a> Practice Board<small id="setname"></small></h1>
    <span class="spacer"></span>
    <label>I am <select id="student"><option value="">the teacher</option></select></label>
    <label title="Show the tunes whose rhythm and pitch concepts the Ontario curriculum has named by this grade">For <select id="grade"><option value="0">any grade</option></select></label>
    <button id="roster">Class list</button>
    <button id="theme" title="Light or dark">☾</button>
    <div class="summary" id="summary"></div>
  </header>
  <div id="view"></div>

  <dialog id="rosterDlg">
    <h2>Class list</h2>
    <p>One name per line. Names and progress stay in this browser; Export writes them to a file so another computer can Import them.</p>
    <textarea id="names" placeholder="Ada&#10;Ben&#10;Chloé"></textarea>
    <div class="row">
      <div class="left"><button id="export">Export</button><button id="import">Import</button><input type="file" id="file" accept=".json,application/json" hidden></div>
      <button id="cancel">Cancel</button><button id="saveRoster" class="primary">Save</button>
    </div>
  </dialog>
  <div id="toast"></div>

  <script>
    'use strict';
    const STORE = 'gcs-course-v1';
    const PASS_SHARE = 0.5;                   // a level is done once this share of its tunes is passed
    const LEVEL_COLOR = { 1: 'var(--l1)', 2: 'var(--l2)', 3: 'var(--l3)', 4: 'var(--l4)', 5: 'var(--l5)', 6: 'var(--l6)' };
    const STATES = ['practising', 'ready', 'passed'];
    const $ = s => document.querySelector(s);
    let set = null;
    let state = { roster: [], progress: {} };   // progress[tuneId][name] = { state, date }
    try {
      const s = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (s && Array.isArray(s.roster)) {
        state = { roster: s.roster, progress: s.progress || {} };
        for (const [id, m] of Object.entries(s.sends || {}))                     // the first board kept "sends": those are passes
          for (const [name, date] of Object.entries(m)) (state.progress[id] || (state.progress[id] = {}))[name] = { state: 'passed', date };
      }
    } catch (e) {}
    const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };
    let student = '';
    try { student = sessionStorage.getItem('gcs-course-student') || ''; } catch (e) {}

    /* ---- the Ontario grade filter, shared with the lab's and the main page's pickers ----
       Each tune carries ontario.grade: the grade in which The Ontario Curriculum, Grades 1-8: The Arts first names
       a duration or pitch concept it uses (course/ontario.md). The filter keeps the tunes at or under a grade. */
    const GRADE_STORE = 'gcs-course-grade';
    let gradeCap = 0;
    try { gradeCap = Math.min(8, Math.max(0, parseInt(localStorage.getItem(GRADE_STORE), 10) || 0)); } catch (e) {}
    const gradeOf = t => (t.ontario && t.ontario.grade) || 1;
    const tunes = () => gradeCap ? set.tunes.filter(t => gradeOf(t) <= gradeCap) : set.tunes;
    { const g = $('#grade'); for (let i = 1; i <= 8; i++) g.add(new Option(`grade ${i}`, i)); g.value = String(gradeCap);
      g.addEventListener('change', () => { gradeCap = +g.value; try { localStorage.setItem(GRADE_STORE, String(gradeCap)); } catch (e) {} render(); }); }

    /* ---- theme, shared with the main page ---- */
    const isDark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    try { const t = localStorage.getItem('gcs-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
    const paintTheme = () => { $('#theme').textContent = isDark() ? '☀' : '☾'; };
    $('#theme').addEventListener('click', () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('gcs-theme', next); } catch (e) {} paintTheme(); });
    paintTheme();

    /* ---- progress ---- */
    const stateOf = (id, name) => ((state.progress[id] || {})[name] || {}).state || '';
    const dateOf = (id, name) => ((state.progress[id] || {})[name] || {}).date || '';
    function setState(id, name, st) {
      const m = state.progress[id] || (state.progress[id] = {});
      if (st) m[name] = { state: st, date: new Date().toISOString().slice(0, 10) }; else delete m[name];
      if (!Object.keys(m).length) delete state.progress[id];
      persist();
    }
    const tunesAt = l => tunes().filter(t => t.level === l);
    const needed = l => Math.ceil(tunesAt(l).length * PASS_SHARE);
    const passedAt = (l, name) => tunesAt(l).filter(t => stateOf(t.id, name) === 'passed').length;
    const levelDone = (l, name) => tunesAt(l).length > 0 && passedAt(l, name) >= needed(l);
    function currentLevel(name) {           // the lowest level with tunes that is not yet done
      for (let l = 1; l <= 6; l++) if (tunesAt(l).length && !levelDone(l, name)) return l;
      return null;
    }
    const levelWords = l => (set.levels && set.levels[l] || []).join(', ');

    /* ---- the skill tags in words ---- */
    const DEGREE = { do: 'do', di: 'di', re: 're', ri: 'ri', mi: 'mi', fa: 'fa', fi: 'fi', so: 'so', si: 'si', la: 'la', te: 'te', ti: 'ti' };
    function wordsFor(tag) {
      const [k, v] = tag.split(':');
      if (k === 'degree') return DEGREE[v] || v;
      if (k === 'dur') return ({ '1': 'one-beat notes', '2': 'two-beat notes', '3': 'three-beat notes', '4': 'four-beat notes', '1/2': 'half beats', '1/4': 'quarter beats', '3/2': 'dotted beats', '3/4': 'dotted half beats', '1/3': 'thirds of a beat', '2/3': 'two-thirds of a beat', '1/6': 'sixths of a beat' })[v] || `${v}-beat notes`;
      if (k === 'leap') return v === 'over-octave' ? 'leaps over an octave' : `leaps of a ${v}`;
      if (k === 'range') return ({ '6th': 'range of a 6th', octave: 'range of an octave', 'over-octave': 'range over an octave' })[v] || tag;
      if (k === 'metre') return v;
      if (k === 'syncopation') return v ? 'much syncopation' : 'syncopation';
      if (k === 'key') return null;
      return ({ tie: 'ties', 'tie-over-bar': 'ties over the bar', pickup: 'a pickup', rest: 'rests', 'rest-off-beat': 'rests off the beat', repeat: 'repeats', endings: 'first and second endings', triplet: 'triplets', 'triplet-in-compound': 'triplets', tuplet: 'tuplets', accidentals: 'accidentals', 'grace-notes': 'grace notes', 'double-stops': 'two notes at once', 'metre-change': 'a change of metre', 'key-change': 'a change of key' })[k] || tag;
    }

    /* ---- the share link the main page reads: "=== type" blocks, deflated, base64url ---- */
    const b64u = bytes => { let b = ''; for (let i = 0; i < bytes.length; i += 0x8000) b += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
    async function openLink(tune) {
      const doc = `=== heading\n${tune.title}\n=== abc\n${tune.abc}`;
      const bytes = new TextEncoder().encode(doc);
      let tag = 't', payload = bytes;
      if (typeof CompressionStream === 'function') { try { payload = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); tag = 'z'; } catch (e) {} }
      return new URL('../index.html', location.href).href + '#gcs=' + tag + b64u(payload);
    }
    const openTune = async t => { window.open(await openLink(t), 'gcs-page'); };

    /* ---- incipit: the header fields and the first bars ---- */
    function incipit(abc, n = 2) {
      const lines = abc.split('\n');
      const head = lines.filter(l => /^[KLMQ]:/.test(l));
      const body = lines.find(l => l.trim() && !/^[A-Za-z]:/.test(l) && !/^%/.test(l) && !/^w:/.test(l)) || '';
      const bars = body.replace(/^\s*\|?:?/, '').split('|').filter(s => s.trim());
      return `X:1\n${head.join('\n')}\n${bars.slice(0, n).join('|')}|`;
    }

    /* ---- rendering ---- */
    function render() {
      $('#setname').textContent = set.name;
      const sel = $('#student'); sel.innerHTML = '<option value="">the teacher</option>';
      for (const n of state.roster) sel.add(new Option(n, n));
      if (!state.roster.includes(student)) student = '';
      sel.value = student;
      const view = $('#view'); view.innerHTML = ''; view.className = student ? 'me' : '';
      if (student) renderStudent(view); else renderTeacher(view);
    }

    function levelPills(sum, name) {
      for (let l = 1; l <= 6; l++) {
        if (!tunesAt(l).length) continue;
        const pill = document.createElement('span'); pill.className = 'pill' + (levelDone(l, name) ? ' done' : '');
        pill.innerHTML = `<i style="background:${LEVEL_COLOR[l]}"></i> Level ${l}: ${passedAt(l, name)} of ${tunesAt(l).length}${levelDone(l, name) ? ' ✓' : ''}`;
        sum.appendChild(pill);
      }
    }
    const tape = l => `<span class="tape" style="background:${LEVEL_COLOR[l]}"></span>`;

    /* The student's page: what they are practising, their level's tunes to pick from, the levels ahead, the levels done. */
    function renderStudent(view) {
      const sum = $('#summary'); sum.innerHTML = '';
      const cur = currentLevel(student);
      const lead = document.createElement('span'); lead.className = 'lead';
      lead.textContent = cur ? `${student}, you are on level ${cur}` : `${student}, you have passed every level in this set`;
      sum.appendChild(lead); levelPills(sum, student);

      const mine = tunes().filter(t => ['practising', 'ready'].includes(stateOf(t.id, student)));
      if (mine.length) {
        const s = document.createElement('section');
        s.innerHTML = `<h2>Practising now<small>${mine.length} tune${mine.length === 1 ? '' : 's'}</small></h2>
          <p class="hint">Open plays a tune in the main page: listen, slow it down, play along. When you can play it through, press <b>Ready to show</b>, then play it for your teacher or send a video.</p>
          <div class="cards"></div>`;
        for (const t of mine) s.querySelector('.cards').appendChild(tuneCard(t, { bars: 4 }));
        view.appendChild(s);
      }

      if (cur) {
        const s = document.createElement('section');
        const left = needed(cur) - passedAt(cur, student);
        s.innerHTML = `<h2>${tape(cur)}Level ${cur}: pick a tune<small>pass ${left} more to move up</small></h2>
          <p class="hint">${mine.length ? '' : 'Choose any tune here and press <b>Practise</b>. '}Tunes at this level use ${esc(levelWords(cur))}. The outlined words on a card are what it brings in that the tunes before it did not.</p>
          <div class="cards"></div>`;
        for (const t of tunesAt(cur)) s.querySelector('.cards').appendChild(tuneCard(t, { bars: 4 }));
        view.appendChild(s);
      }

      const ahead = cur ? [cur + 1, cur + 2].filter(l => l <= 6 && tunesAt(l).length) : [];
      for (const l of ahead) {
        const d = document.createElement('details');
        d.innerHTML = `<summary>${tape(l)}Level ${l}: looking ahead<small>${tunesAt(l).length} tunes</small></summary>
          <p class="hint">You can try these early if one takes your fancy. They use ${esc(levelWords(l))}.</p><div class="cards"></div>`;
        for (const t of tunesAt(l)) d.querySelector('.cards').appendChild(tuneCard(t, {}));
        view.appendChild(d);
      }

      for (let l = 1; l <= 6; l++) {
        if (!tunesAt(l).length || l === cur || ahead.includes(l) || (cur !== null && l > cur)) continue;
        const d = document.createElement('details');
        d.innerHTML = `<summary>${tape(l)}Level ${l}: done ✓<small>${passedAt(l, student)} of ${tunesAt(l).length} passed</small></summary>
          <p class="hint">Come back for the ones you skipped whenever you like.</p><div class="cards"></div>`;
        for (const t of tunesAt(l)) d.querySelector('.cards').appendChild(tuneCard(t, {}));
        view.appendChild(d);
      }
    }

    /* The teacher's page: the ready queue, then every level as a wall of cards showing each student's state. */
    function renderTeacher(view) {
      const sum = $('#summary'); sum.innerHTML = '';
      const names = state.roster;
      const ready = [];
      const shown = tunes();
      for (const t of shown) for (const n of names) if (stateOf(t.id, n) === 'ready') ready.push([n, t]);
      const passes = shown.reduce((s, t) => s + names.filter(n => stateOf(t.id, n) === 'passed').length, 0);
      const scope = gradeCap ? ` (the ${shown.length} of ${set.tunes.length} tunes for grade ${gradeCap} and under)` : '';
      sum.textContent = names.length
        ? `${names.length} students, ${passes} passes across ${shown.length} tunes${ready.length ? `, ${ready.length} ready to show` : ''}${scope}. Choose a name to see that student's page.`
        : `${shown.length} tunes in six levels${scope}. Add names with Class list; each student then picks their name to see their level.`;

      if (ready.length) {
        const q = document.createElement('section'); q.className = 'queue';
        q.innerHTML = `<h2>Ready to show</h2>`;
        for (const [n, t] of ready) {
          const row = document.createElement('div'); row.className = 'row';
          row.innerHTML = `<span class="what"><b>${esc(n)}</b>: ${esc(t.title)}<small>level ${t.level}</small></span>
            <button class="open">Open</button><button class="not">Not yet</button><button class="pass">Passed ✓</button>`;
          row.querySelector('.open').addEventListener('click', () => openTune(t));
          row.querySelector('.not').addEventListener('click', () => { setState(t.id, n, 'practising'); render(); });
          row.querySelector('.pass').addEventListener('click', () => { setState(t.id, n, 'passed'); render(); toast(`${n} passed ${t.title}`); });
          q.appendChild(row);
        }
        view.appendChild(q);
      }

      const legend = document.createElement('div'); legend.className = 'legend';
      legend.innerHTML = `<span><b>Class</b> on a card shows every student:</span><span><i style="border-color:var(--prac)"></i>practising</span><span><i style="background:var(--ready)"></i>ready to show</span><span><i style="background:var(--pass)"></i>passed</span><span>Tap a name to mark it passed, tap again to clear. A level is done at half its tunes passed.</span>`;
      view.appendChild(legend);

      const wall = document.createElement('div'); wall.className = 'wall';
      for (let l = 1; l <= 6; l++) {
        const col = document.createElement('section'); col.className = 'col';
        const tunes = tunesAt(l);
        const here = names.filter(n => currentLevel(n) === l).length;
        col.innerHTML = `<h2>${tape(l)}Level ${l}<small>${names.length ? `${here} student${here === 1 ? '' : 's'} here` : `${tunes.length} tune${tunes.length === 1 ? '' : 's'}`}</small></h2>
          <div class="rungs">${(set.levels && set.levels[l] || []).slice(0, 4).join(' · ')}</div>`;
        if (!tunes.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No tunes at this level in this set yet.'; col.appendChild(e); }
        for (const t of tunes) col.appendChild(tuneCard(t, {}));
        wall.appendChild(col);
      }
      view.appendChild(wall);
    }

    const openCards = {};                     // which teacher cards show their Class chips, kept across re-renders
    function tuneCard(t, { bars = 2 } = {}) {
      const el = document.createElement('article');
      const st = student ? stateOf(t.id, student) : '';
      el.className = 'tune' + (st ? ' ' + st : '');
      el.style.setProperty('--lvl', LEVEL_COLOR[t.level]);
      const intro = new Set(t.introduces || []);
      const tags = (t.skills || []).map(s => [s, wordsFor(s)]).filter(([, w]) => w);
      const shown = tags.filter(([s]) => intro.has(s)).concat(tags.filter(([s]) => !intro.has(s) && !/^(degree|dur|metre|range):/.test(s))).slice(0, 6);
      const who = t.origin || t.composer || '';
      let actions;
      if (!student) {
        const n = STATES.map(s => state.roster.filter(name => stateOf(t.id, name) === s).length);
        const bits = [n[2] && `<b>${n[2]}</b> passed`, n[1] && `<b>${n[1]}</b> ready`, n[0] && `<b>${n[0]}</b> practising`].filter(Boolean);
        actions = `<button class="toggle">Class</button><span class="state">${bits.join(' · ')}</span>`;
      }
      else if (st === 'passed') actions = `<span class="state"><b>Passed ✓</b> ${esc(dateOf(t.id, student))}</span>`;
      else if (st === 'ready') actions = `<button class="set ready" data-to="practising" title="Back to practising">Ready to show ✓</button><button class="set quiet" data-to="">Stop</button>`;
      else if (st === 'practising') actions = `<button class="set primary" data-to="ready">Ready to show</button><button class="set quiet" data-to="">Stop</button>`;
      else actions = `<button class="set" data-to="practising">Practise</button>`;
      el.innerHTML = `
        <div class="top"><h3>${esc(t.title)}</h3><span class="meta">${esc(t.key)} · ${esc(t.metre)} · ${t.bars} bars</span></div>
        <div class="incipit"></div>
        <div class="tags">${shown.map(([s, w]) => `<span class="tag${intro.has(s) ? ' new' : ''}">${esc(w)}</span>`).join('')}${who ? `<span class="tag">${esc(who)}</span>` : ''}${t.ontario ? `<span class="tag grade" title="Ontario curriculum: ${esc(t.ontario.concepts.join('; '))}">grade ${t.ontario.grade}</span>` : ''}</div>
        <div class="actions"><button class="open" title="Open this tune in the main page, ready to play">Open</button>${actions}</div>
        <div class="who"></div>`;
      el.querySelector('.open').addEventListener('click', () => openTune(t));
      for (const b of el.querySelectorAll('.set')) b.addEventListener('click', () => {
        const to = b.dataset.to; setState(t.id, student, to); render();
        if (to === 'ready') toast(`Tell your teacher ${t.title} is ready`);
      });
      if (!student) {
        const who = el.querySelector('.who');
        if (!state.roster.length) who.innerHTML = '<span class="nobody">No class list yet.</span>';
        for (const n of state.roster) {
          const b = document.createElement('button'); const s = stateOf(t.id, n); b.className = 'chip' + (s ? ' ' + s : ''); b.textContent = n; b.title = s || 'not started';
          b.addEventListener('click', () => { setState(t.id, n, s === 'passed' ? '' : 'passed'); render(); });
          who.appendChild(b);
        }
        el.querySelector('.toggle').addEventListener('click', () => { el.classList.toggle('open'); openCards[t.id] = el.classList.contains('open'); });
        if (openCards[t.id]) el.classList.add('open');
      }
      queueRender(el.querySelector('.incipit'), incipit(t.abc, bars));
      return el;
    }
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    // abcjs loads deferred; draw incipits once it is here, a few per frame.
    const queue = [];
    function queueRender(el, abc) { queue.push([el, abc]); drain(); }
    let draining = false;
    function drain() {
      if (draining || !window.ABCJS) return; draining = true;
      const step = () => {
        for (let i = 0; i < 4 && queue.length; i++) {
          const [el, abc] = queue.shift();
          if (!el.isConnected) continue;
          try { ABCJS.renderAbc(el, abc, { scale: 0.62, staffwidth: Math.max(180, el.clientWidth - 8), paddingtop: 0, paddingbottom: 0, paddingleft: 0, paddingright: 0, responsive: 'resize' }); } catch (e) { el.textContent = ''; }
        }
        if (queue.length) requestAnimationFrame(step); else draining = false;
      };
      requestAnimationFrame(step);
    }
    document.querySelector('script[src$="abcjs-basic-min.js"]').addEventListener('load', drain);

    /* ---- class list dialog, export and import ---- */
    const dlg = $('#rosterDlg');
    $('#roster').addEventListener('click', () => { $('#names').value = state.roster.join('\n'); dlg.showModal(); });
    $('#cancel').addEventListener('click', () => dlg.close());
    $('#saveRoster').addEventListener('click', () => {
      state.roster = [...new Set($('#names').value.split('\n').map(s => s.trim()).filter(Boolean))];
      persist(); dlg.close(); render();
    });
    $('#export').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ set: set.name, ...state }, null, 1)], { type: 'application/json' }));
      a.download = 'practice-board.json'; a.click(); URL.revokeObjectURL(a.href);
    });
    $('#import').addEventListener('click', () => $('#file').click());
    $('#file').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const j = JSON.parse(await f.text());
        if (!Array.isArray(j.roster)) throw new Error('no roster');
        state.roster = [...new Set([...state.roster, ...j.roster])];
        for (const [id, m] of Object.entries(j.progress || {})) state.progress[id] = { ...(state.progress[id] || {}), ...m };
        for (const [id, m] of Object.entries(j.sends || {}))                     // an export from the first board
          for (const [name, date] of Object.entries(m)) (state.progress[id] || (state.progress[id] = {}))[name] = { state: 'passed', date };
        persist(); dlg.close(); render(); toast('Imported');
      } catch (err) { toast('That file is not a practice board export'); }
      e.target.value = '';
    });
    $('#student').addEventListener('change', e => { student = e.target.value; try { sessionStorage.setItem('gcs-course-student', student); } catch (err) {} render(); });
    let toastTimer;
    function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200); }

    /* ---- go ---- */
    fetch('set.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(s => { set = s; render(); })
      .catch(err => { $('#summary').textContent = location.protocol === 'file:' ? 'The board needs to be served (double-click serve.command, then open course/board.html from there): a page opened from disk cannot read set.json.' : `Could not load set.json (${err.message}).`; });
  </script>
</body>
</html>
