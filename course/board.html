<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practice Board · Grand Central Stationery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)">
  <link href="../fonts/fonts.css" rel="stylesheet">
  <script src="../vendor/abcjs-basic-min.js" defer></script>
  <script src="analyze.js" defer></script>
  <script src="practice.js" defer></script>
  <script src="sets.js" defer></script>
  <style>
    /*
      The practice board: the current set of tunes, graded into six levels, with
      three ways in.

        Teach     choose a level and a piece, then open it on the projector in
                  three steps: listen (and hear what is new), learn the sections
                  (study each, a fingering under every note; then loop them
                  together, growing and faster), put it together.
        Practice  a student's level and pieces, with what they have practised on
                  this computer: listen, learn the sections, put it together,
                  play it through.
        Assess    choose the student, then a piece at their level (or draw one);
                  the assessment opens beside the music.

      The address keeps the way in, the level and the piece (#do=teach&level=2&tune=...),
      so the board can be shared or bookmarked at any of them. Names, progress
      and marks never go in an address.

      Class records hold the teacher's wall of every level, the queue of
      students who are ready to show a tune, the class list, the test history,
      export, import and the spreadsheet report. A level is done once half its
      tunes are passed, and the next one opens. Nothing leaves the browser.
    */
    :root {
      --font: 'Atkinson Hyperlegible', system-ui, sans-serif;
      --ink: #222; --bg: #fff; --panel: #fafafa; --panel-2: #fff; --line: #ddd; --line-2: #eee; --muted: #6d6d6d;
      --accent: #087fca; --pass: #4f9a2c; --ready: #e0b800; --prac: #087fca;
      --teach: #087fca; --practice: #3f8f1f; --assess: #79569f;
      --l1: #69b944; --l2: #e0b800; --l3: #f39322; --l4: #e72829; --l5: #087fca; --l6: #79569f;
    }
    :root[data-theme="dark"] { --ink: #e8e8e8; --bg: #1b1b1b; --panel: #232323; --panel-2: #2a2a2a; --line: #3a3a3a; --line-2: #333; --muted: #a2a2a2; --accent: #4fa8e8; --prac: #4fa8e8; --teach: #4fa8e8; --practice: #69b944; --assess: #a585c9; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #e8e8e8; --bg: #1b1b1b; --panel: #232323; --panel-2: #2a2a2a; --line: #3a3a3a; --line-2: #333; --muted: #a2a2a2; --accent: #4fa8e8; --prac: #4fa8e8; --teach: #4fa8e8; --practice: #69b944; --assess: #a585c9; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
    body { padding: 0 16px 40px; }
    button, select, input, textarea { font: inherit; color: inherit; }
    button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; min-height: 40px; }
    button:hover { border-color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.pass { background: var(--pass); border-color: var(--pass); color: #fff; }
    button.ready { background: var(--ready); border-color: var(--ready); color: #222; }
    button.quiet { border-color: transparent; background: transparent; color: var(--muted); }
    select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-height: 40px; }
    a { color: var(--accent); }

    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 0 8px; }
    header h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
    header h1 small { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 8px; }
    header h1 small.brand { display: block; margin: 2px 0 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
    header .spacer { flex: 1; }
    header .links { display: flex; gap: 12px; align-items: center; font-size: 15px; }
    #theme { width: 40px; padding: 6px 0; }

    /* ---- the three ways in ---- */
    .ways { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 12px; }
    .ways button { min-height: 64px; text-align: left; padding: 10px 14px; border-width: 2px; border-radius: 14px; display: flex; flex-direction: column; gap: 2px; }
    .ways button b { font-size: 19px; }
    .ways button span { font-size: 13px; color: var(--muted); }
    .ways button[data-do="teach"] { border-color: color-mix(in srgb, var(--teach) 45%, var(--line)); }
    .ways button[data-do="practice"] { border-color: color-mix(in srgb, var(--practice) 45%, var(--line)); }
    .ways button[data-do="assess"] { border-color: color-mix(in srgb, var(--assess) 45%, var(--line)); }
    .ways button[aria-pressed="true"][data-do="teach"] { background: var(--teach); border-color: var(--teach); color: #fff; }
    .ways button[aria-pressed="true"][data-do="practice"] { background: var(--practice); border-color: var(--practice); color: #fff; }
    .ways button[aria-pressed="true"][data-do="assess"] { background: var(--assess); border-color: var(--assess); color: #fff; }
    .ways button[aria-pressed="true"] span { color: rgba(255,255,255,0.88); }

    /* ---- the level bar and the choices for this way in ---- */
    .setup { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 0 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 3; }
    .levels { display: flex; flex-wrap: wrap; gap: 6px; }
    .levels button { display: inline-flex; align-items: center; gap: 6px; min-width: 64px; min-height: 44px; font-weight: 700; }
    .levels button .tape { width: 10px; height: 20px; border-radius: 3px; transform: skewX(-12deg); display: inline-block; }
    .levels button small { font-weight: 400; color: var(--muted); }
    .levels button[aria-pressed="true"] { border-width: 2px; border-color: var(--ink); background: var(--panel); }
    .setup label { color: var(--muted); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
    .setup .who { font-weight: 700; color: var(--ink); }
    .note { color: var(--muted); font-size: 14px; margin: 10px 0 0; line-height: 1.4; }

    .level h2 { font-size: 20px; margin: 16px 0 2px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .level h2 .tape { width: 14px; height: 26px; border-radius: 3px; transform: skewX(-12deg); display: inline-block; }
    .level h2 small { font-weight: 400; color: var(--muted); font-size: 14px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; align-items: start; margin-top: 10px; }

    /* ---- a piece ---- */
    .piece { background: var(--panel-2); border: 1px solid var(--line); border-left: 6px solid var(--lvl); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .piece.chosen { box-shadow: 0 0 0 3px var(--accent); }
    .piece h3 { font-size: 17px; margin: 0; line-height: 1.25; }
    .piece .facts { font-size: 13px; color: var(--muted); }
    .piece .goal { font-size: 14px; }
    .piece .incipit { margin: 0 -4px; min-height: 44px; overflow: hidden; }
    .piece .incipit svg { color: var(--ink); max-width: 100%; height: auto; }
    .piece .fits { display: flex; flex-wrap: wrap; gap: 4px; }
    .piece .fit { font-size: 12px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line-2); color: var(--muted); }
    .piece .fit.yes { border-color: color-mix(in srgb, var(--pass) 60%, var(--line)); color: var(--ink); }
    .piece .mine { font-size: 13px; color: var(--muted); }
    .piece .mine b { color: var(--ink); }
    .piece .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
    .piece .acts .go { font-weight: 700; color: #fff; min-height: 44px; padding: 6px 18px; border-radius: 10px; display: inline-flex; align-items: center; text-decoration: none; border: 1px solid; }
    .piece .acts .go.teach { background: var(--teach); border-color: var(--teach); }
    .piece .acts .go.practice { background: var(--practice); border-color: var(--practice); }
    .piece .acts .go.assess { background: var(--assess); border-color: var(--assess); }
    .piece .acts .state { margin-left: auto; font-size: 13px; color: var(--muted); }
    .piece.passed { border-left-color: var(--pass); }
    .piece.ready { border-left-color: var(--ready); }

    /* ---- class records (the teacher's wall, the queue, the class list, tests) ---- */
    details.records { margin-top: 28px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 8px 12px; }
    details.records > summary { cursor: pointer; font-weight: 700; font-size: 17px; padding: 6px 0; min-height: 40px; display: flex; align-items: center; gap: 10px; }
    details.records > summary small { font-weight: 400; color: var(--muted); font-size: 14px; }
    .summary { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 14px; margin: 6px 0; }
    .summary .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); background: var(--panel); }
    .summary .pill i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .queue { margin-top: 14px; border: 1px solid var(--ready); border-radius: 14px; background: color-mix(in srgb, var(--ready) 8%, var(--panel)); padding: 10px 12px; }
    .queue h2 { font-size: 16px; margin: 0 0 6px; }
    .queue .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); }
    .queue .row:first-of-type { border-top: 0; }
    .queue .row .what { flex: 1; min-width: 180px; }
    .queue .row .what small { color: var(--muted); margin-left: 6px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; margin: 12px 0 0; align-items: center; }
    .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: -1px; border: 2px solid transparent; }
    .wall { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; padding-top: 10px; align-items: start; }
    .col { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
    .col h2 { margin: 2px 4px 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .col h2 .tape { width: 14px; height: 26px; border-radius: 3px; transform: skewX(-12deg); display: inline-block; }
    .col h2 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: auto; }
    .row-tune { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 4px; border-top: 1px dashed var(--line-2); }
    .row-tune .t { flex: 1; min-width: 120px; font-size: 14px; }
    .row-tune .t a { color: var(--ink); text-decoration: none; }
    .row-tune .t a:hover { text-decoration: underline; }
    .chip { border-radius: 999px; padding: 2px 9px; font-size: 13px; min-height: 30px; }
    .chip.practising { border-color: var(--prac); color: var(--prac); }
    .chip.ready { background: var(--ready); border-color: var(--ready); color: #222; }
    .chip.passed { background: var(--pass); border-color: var(--pass); color: #fff; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; }
    .tests { margin-top: 12px; overflow-x: auto; }
    .tests table { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 6px; }
    .tests td, .tests th { text-align: left; padding: 4px 8px 4px 0; border-top: 1px dashed var(--line); vertical-align: top; }
    .tests th { color: var(--muted); font-weight: 400; border-top: 0; }
    .res { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .res.pass { background: var(--pass); color: #fff; } .res.practice { background: var(--ready); color: #222; } .res.na { background: var(--line); }
    .res.m1 { background: var(--l4); color: #fff; } .res.m2 { background: var(--l3); color: #222; } .res.m3 { background: var(--pass); color: #fff; } .res.m4 { background: var(--l5); color: #fff; }

    dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 18px; max-width: 460px; width: calc(100vw - 32px); }
    dialog::backdrop { background: rgba(0,0,0,0.35); }
    dialog h2 { margin: 0 0 6px; font-size: 18px; }
    dialog p { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
    dialog textarea { width: 100%; min-height: 160px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
    dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
    dialog .row .left { margin-right: auto; display: flex; gap: 8px; }
    #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: calc(100vw - 32px); }
    #toast.on { opacity: 1; }
    @media (max-width: 700px) {
      .ways { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .ways button { min-height: 52px; padding: 6px 8px; }
      .ways button b { font-size: 16px; }
      .ways button span { display: none; }
      .setup { position: static; }
      .levels button { min-width: 48px; padding: 6px 8px; }
      .levels button small { display: none; }
      .cards { grid-template-columns: 1fr; }
      header h1 small { display: block; margin: 2px 0 0; }
      header { gap: 6px 12px; } header .spacer { display: none; } header .links { order: 3; flex-basis: 100%; }
      .setup { gap: 6px 10px; } .setup label { font-size: 13px; } .setup select { max-width: 10em; }
    }
    @media (min-width: 1500px) { body { font-size: 18px; } .cards { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); } .piece h3 { font-size: 20px; } }
    @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  </style>
</head>
<body>
  <header>
    <h1>Practice Board<small id="setname"></small><small class="brand">Grand Central Stationery</small></h1>
    <span class="spacer"></span>
    <span class="links"><a href="library.html" title="Every tune, pattern, step and dance the course holds, searchable">Library</a><a href="../index.html#lesson" title="Grand Central Stationery's lesson page: text, notation, rhythm and dance cells to present to a class">Lesson page</a></span>
    <button id="theme" title="Light or dark" aria-label="Light or dark">☾</button>
  </header>
  <nav class="ways" aria-label="What to do">
    <button type="button" data-do="teach" aria-pressed="false"><b>Teach</b><span>For the class: listen, learn the sections, put it together</span></button>
    <button type="button" data-do="practice" aria-pressed="false"><b>Practice</b><span>For a student: the same steps at your own pace, then play it through</span></button>
    <button type="button" data-do="assess" aria-pressed="false"><b>Assess</b><span>Beside one student: listen, then pass or practise more</span></button>
  </nav>
  <div class="setup" id="setup"></div>
  <main id="view"></main>
  <details class="records" id="records">
    <summary>Class records <small id="recsum"></small></summary>
    <div id="recview"></div>
  </details>

  <dialog id="rosterDlg">
    <h2>Class list</h2>
    <p>One name per line. Names and progress stay in this browser; Export writes them to a file so another computer can Import them.</p>
    <textarea id="names" placeholder="Ada&#10;Ben&#10;Chloé"></textarea>
    <div class="row">
      <div class="left"><button id="export">Export</button><button id="import">Import</button><input type="file" id="file" accept=".json,application/json" hidden></div>
      <button id="cancel">Cancel</button><button id="saveRoster" class="primary">Save</button>
    </div>
  </dialog>
  <div id="toast" role="status"></div>

  <script>
    'use strict';
    const STORE = 'gcs-course-v1';
    const PASS_SHARE = 0.5;                   // a level is done once this share of its tunes is passed
    const LEVEL_COLOR = { 1: 'var(--l1)', 2: 'var(--l2)', 3: 'var(--l3)', 4: 'var(--l4)', 5: 'var(--l5)', 6: 'var(--l6)' };
    const STATES = ['practising', 'ready', 'passed'];
    const $ = s => document.querySelector(s);
    const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    let set = null, P = null;
    let state = { roster: [], progress: {}, levels: {}, tests: {} };   // progress[tuneId][name] = { state, date }; levels[name] = the level a student chose; tests[name] = [{ date, id, title, level, result | mark, note, bpm, assist }]
    try {
      const s = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (s && Array.isArray(s.roster)) {
        state = { roster: s.roster, progress: s.progress || {}, levels: s.levels || {}, tests: s.tests || {} };
        for (const [id, m] of Object.entries(s.sends || {}))                     // the first board kept "sends": those are passes
          for (const [name, date] of Object.entries(m)) (state.progress[id] || (state.progress[id] = {}))[name] = { state: 'passed', date };
      }
    } catch (e) {}
    const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };
    // Who is practising or being assessed: this tab only (sessionStorage), never the address.
    let student = '';
    try { student = sessionStorage.getItem('gcs-course-student') || ''; } catch (e) {}
    const setStudent = n => { student = n; try { sessionStorage.setItem('gcs-course-student', n); sessionStorage.setItem('gcs-assess-student', n); } catch (e) {} };
    // The way in, the level and the piece: the address.
    let way = 'teach', level = null, chosen = '';
    let inst = 'recorder'; try { inst = localStorage.getItem('gcs-last-inst') || 'recorder'; } catch (e) {}

    /* ---- the Ontario grade filter, shared with the lab's and the main page's pickers ----
       Each tune carries ontario.grade: the grade in which The Ontario Curriculum, Grades 1-8: The Arts first names
       a duration or pitch concept it uses (course/ontario.md). The filter keeps the tunes at or under a grade. */
    const GRADE_STORE = 'gcs-course-grade';
    let gradeCap = 0;
    try { gradeCap = Math.min(8, Math.max(0, parseInt(localStorage.getItem(GRADE_STORE), 10) || 0)); } catch (e) {}
    const gradeOf = t => (t.ontario && t.ontario.grade) || 1;
    const tunes = () => gradeCap ? set.tunes.filter(t => gradeOf(t) <= gradeCap) : set.tunes;

    /* ---- theme, shared with the main page ---- */
    const isDark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    try { const t = localStorage.getItem('gcs-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
    const paintTheme = () => { $('#theme').textContent = isDark() ? '☀' : '☾'; };
    $('#theme').addEventListener('click', () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('gcs-theme', next); } catch (e) {} paintTheme(); });
    paintTheme();

    /* ---- progress ---- */
    const stateOf = (id, name) => ((state.progress[id] || {})[name] || {}).state || '';
    const dateOf = (id, name) => ((state.progress[id] || {})[name] || {}).date || '';
    function setState(id, name, st) {
      const m = state.progress[id] || (state.progress[id] = {});
      if (st) m[name] = { state: st, date: new Date().toISOString().slice(0, 10) }; else delete m[name];
      if (!Object.keys(m).length) delete state.progress[id];
      persist();
    }
    const tunesAt = l => tunes().filter(t => t.level === l);
    const needed = l => Math.ceil(tunesAt(l).length * PASS_SHARE);
    const passedAt = (l, name) => tunesAt(l).filter(t => stateOf(t.id, name) === 'passed').length;
    const levelDone = (l, name) => tunesAt(l).length > 0 && passedAt(l, name) >= needed(l);
    function derivedLevel(name) {           // the lowest level with tunes that is not yet done
      for (let l = 1; l <= 6; l++) if (tunesAt(l).length && !levelDone(l, name)) return l;
      return null;
    }
    // A student on their own computer has no passes to go by, so they can choose their level; the choice travels with Export.
    const currentLevel = name => state.levels[name] && tunesAt(state.levels[name]).length ? state.levels[name] : derivedLevel(name);
    const testsOf = name => state.tests[name] || [];
    const levelWords = l => (set.levels && set.levels[l] || []).join(', ');
    const firstLevel = () => { for (let l = 1; l <= 6; l++) if (tunesAt(l).length) return l; return 1; };

    /* ---- links into the piece view ---- */
    // The class instrument rides in the link, with the transposition that brings the piece into its range (none when it fits as written).
    const pieceUrl = (t, mode) => new URL(P.pieceHref({ tune: t.id, level: t.level, mode, inst, tr: P.transposeFor(summaryOf(t).fits, inst) || undefined }, true), location.href).href;
    const openPiece = (t, mode) => {
      if (mode === 'assess' && student) setStudent(student);
      location.href = pieceUrl(t, mode);
    };
    function syncUrl() { history.replaceState(null, '', location.pathname + location.search + '#' + P.encodeBoard({ do: way, level, tune: chosen || undefined })); }

    /* ---- the incipit: the header fields and the first bars ---- */
    function incipit(abc, n = 2) {
      const lines = abc.split('\n');
      const head = lines.filter(l => /^[KLMQ]:/.test(l));
      const body = lines.find(l => l.trim() && !/^[A-Za-z]:/.test(l) && !/^%/.test(l) && !/^w:/.test(l)) || '';
      const bars = body.replace(/^\s*\|?:?/, '').split('|').filter(s => s.trim());
      return `X:1\n${head.join('\n')}\n${bars.slice(0, n).join('|')}|`;
    }

    /* ---- rendering ---- */
    const tape = l => `<span class="tape" style="background:${LEVEL_COLOR[l]}" aria-hidden="true"></span>`;
    const summaries = new Map();
    const summaryOf = t => { if (!summaries.has(t.id)) summaries.set(t.id, P.summarize(t, { ABCJS: window.ABCJS, analyze: window.GCSAnalyze, set })); return summaries.get(t.id); };
    function render() {
      $('#setname').textContent = set.name;
      for (const b of document.querySelectorAll('.ways button')) b.setAttribute('aria-pressed', String(b.dataset.do === way));
      if (!state.roster.includes(student)) student = '';
      if (!level || !tunesAt(level).length) level = (way !== 'teach' && student && currentLevel(student)) || firstLevel();
      renderSetup(); renderLevel(); renderRecords(); syncUrl();
    }
    function renderSetup() {
      const el = $('#setup');
      const levels = [1, 2, 3, 4, 5, 6].filter(l => tunesAt(l).length).map(l => `<button type="button" data-level="${l}" aria-pressed="${l === level}" title="${esc(levelWords(l))}">${tape(l)}${l}<small>${tunesAt(l).length} piece${tunesAt(l).length === 1 ? '' : 's'}</small></button>`).join('');
      const names = `<option value="">${way === 'assess' ? 'Choose a student…' : 'Just me'}</option>${state.roster.map(n => `<option${n === student ? ' selected' : ''}>${esc(n)}</option>`).join('')}`;
      const who = way === 'teach' ? '' : state.roster.length ? `<label>${way === 'assess' ? 'Student' : 'Practising as'} <select id="who">${names}</select></label>` : way === 'assess' ? `<button type="button" id="addNames">Add the class list</button>` : '';
      el.innerHTML = `<div class="levels" role="group" aria-label="Level">${levels}</div>${who}
        <label title="The instrument the class plays: the piece opens with its fingering or keys under the music">Instrument <select id="inst">${Object.entries(P.INSTRUMENTS).map(([k, v]) => `<option value="${k}"${k === inst ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
        <label title="Show the tunes whose rhythm and pitch concepts the Ontario curriculum has named by this grade">Grade <select id="grade"><option value="0">any</option>${[1, 2, 3, 4, 5, 6, 7, 8].map(g => `<option value="${g}"${g === gradeCap ? ' selected' : ''}>${g}</option>`).join('')}</select></label>
        ${way === 'assess' && student ? `<button type="button" id="draw" title="A piece at ${esc(student)}'s level that they have not passed or been tested on">Draw a piece for ${esc(student)}</button>` : ''}`;
      el.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => { level = +b.dataset.level; chosen = ''; if (way !== 'teach' && student) { state.levels[student] = level; persist(); } render(); }));
      const w = el.querySelector('#who'); if (w) w.addEventListener('change', () => { setStudent(w.value); level = (student && currentLevel(student)) || level; render(); });
      const an = el.querySelector('#addNames'); if (an) an.addEventListener('click', openRoster);
      el.querySelector('#inst').addEventListener('change', e => { inst = e.target.value; try { localStorage.setItem('gcs-last-inst', inst); } catch (err) {} });
      el.querySelector('#grade').addEventListener('change', e => { gradeCap = +e.target.value; try { localStorage.setItem(GRADE_STORE, String(gradeCap)); } catch (err) {} render(); });
      const d = el.querySelector('#draw'); if (d) d.addEventListener('click', () => { const t = drawPiece(student); if (!t) toast('No pieces left at that level'); else openPiece(t, 'assess'); });
    }
    const WAY_NOTE = {
      teach: 'Open a piece to teach it on the projector in three steps: <b>1 Listen</b> to the whole piece, and to what is new in it; <b>2 Learn the sections</b>: study each one, with a fingering under every note, at the class’s own pace, then loop them together, growing and getting faster; <b>3 Put it together</b>, slow to full speed with the band. <b>Copy student link</b> gives students the piece to practise.',
      practice: 'Open a piece to practise it: listen, learn the sections (in time, or note by note with the app listening if you like), put it together, then play it through. What you practise is kept on this computer.',
      assess: 'Choose the student, then a piece. It opens with the assessment beside the music: hear it, listen to the attempt if you like (the microphone only suggests), then decide.',
    };
    function renderLevel() {
      const view = $('#view'); view.innerHTML = '';
      const s = document.createElement('section'); s.className = 'level';
      const here = tunesAt(level);
      const head = way !== 'teach' && student ? `${esc(student)}: ${levelDone(level, student) ? 'done ✓' : `${passedAt(level, student)} of ${here.length} passed, ${Math.max(0, needed(level) - passedAt(level, student))} more to move up`}` : `${here.length} piece${here.length === 1 ? '' : 's'}`;
      s.innerHTML = `<h2>${tape(level)}Level ${level}<small>${head}</small></h2><p class="note">This level: ${esc(levelWords(level))}.<br>${WAY_NOTE[way]}</p><div class="cards"></div>`;
      const cards = s.querySelector('.cards');
      for (const t of here) cards.appendChild(pieceCard(t));
      view.appendChild(s);
      const c = chosen && view.querySelector(`[data-id="${CSS.escape(chosen)}"]`);
      if (c) requestAnimationFrame(() => c.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));
    }
    function pieceCard(t) {
      const el = document.createElement('article');
      const sum = summaryOf(t);
      const st = student ? stateOf(t.id, student) : '';
      el.className = 'piece' + (chosen === t.id ? ' chosen' : '') + (st ? ' ' + st : '');
      el.dataset.id = t.id; el.style.setProperty('--lvl', LEVEL_COLOR[t.level]);
      const who = t.origin || t.composer || '';
      const fits = sum.fits.filter(f => f.id !== 'recorder' || !sum.fits.find(g => g.id === 'recorder1' && g.fits && !g.tr)).map(f => `<span class="fit${f.fits ? ' yes' : ''}" title="${f.fits ? (f.tr ? `Fits ${f.name.toLowerCase()} moved ${f.tr > 0 ? 'up' : 'down'} ${Math.abs(f.tr)} semitones (Transpose)` : `Fits ${f.name.toLowerCase()} as written`) : `Too wide for ${f.name.toLowerCase()}`}">${esc(f.name)} ${f.fits ? (f.tr ? `${f.tr > 0 ? '↑' : '↓'}${Math.abs(f.tr)}` : '✓') : '✗'}</span>`).join('');
      let mine = '';
      if (way === 'practice') { const pr = P.progressOf(P.readProgress(localStorage), t.id); mine = pr.started ? `<b>${esc(pr.label)}</b>${pr.detail ? ': ' + esc(pr.detail) : ''}` : 'Not practised on this computer yet.'; }
      if (way !== 'teach' && student) { const last = testsOf(student).filter(x => x.id === t.id).pop(); const s2 = st ? `${student} is ${st === 'passed' ? `passed (${esc(dateOf(t.id, student))})` : st === 'ready' ? 'ready to show it' : 'practising it'}` : ''; mine += (mine ? '<br>' : '') + [s2, last ? `last assessed ${esc(last.date)}: ${esc(P.resultWords(last))}` : ''].filter(Boolean).join(' · '); }
      const go = way === 'teach' ? ['teach', 'Teach'] : way === 'practice' ? ['practice', 'Practise'] : ['assess', 'Assess'];
      const mode = way;   // a piece opens at step 1, Listen (Assess: Hear it)
      el.innerHTML = `<h3>${esc(t.title)}</h3>
        <div class="facts">${esc([t.metre, sum.length, sum.range, who].filter(Boolean).join(' · '))}</div>
        <div class="goal">${esc(sum.goal)}</div>
        <div class="incipit" aria-hidden="true"></div>
        <div class="fits" aria-label="Instruments">${fits}</div>
        ${mine ? `<div class="mine">${mine}</div>` : ''}
        <div class="acts"><a class="go ${go[0]}" role="button" href="${esc(pieceUrl(t, mode))}">${go[1]}</a><button type="button" class="copy" title="Copy a link to this piece (piece, instrument; no names or progress)">Copy link</button>
          ${way === 'practice' && student ? (st === 'ready' ? `<button type="button" class="set ready" data-to="practising" title="Back to practising">Ready to show ✓</button>` : st === 'passed' ? '' : `<button type="button" class="set" data-to="ready" title="Tell your teacher you can play it through">Ready to show</button>`) : ''}</div>`;
      el.querySelector('.go').addEventListener('click', e => {
        if (way === 'assess' && !student) { e.preventDefault(); toast(state.roster.length ? 'Choose the student first' : 'Add the class list first'); const w = $('#who'); if (w) w.focus(); return; }
        if (way !== 'teach' && student && !st) setState(t.id, student, 'practising');
        if (student) setStudent(student);
        chosen = t.id; syncUrl();   // Back from the piece returns here, to this card
      });
      el.querySelector('.copy').addEventListener('click', async () => { const url = pieceUrl(t, way === 'assess' ? 'teach' : way); try { await navigator.clipboard.writeText(url); toast('Link copied: it opens this piece for anyone'); } catch (e) { prompt('Copy this link:', url); } });
      for (const b of el.querySelectorAll('.set')) b.addEventListener('click', () => { setState(t.id, student, b.dataset.to); render(); if (b.dataset.to === 'ready') toast(`Tell your teacher ${t.title} is ready`); });
      queueRender(el.querySelector('.incipit'), incipit(t.abc, 4));
      return el;
    }

    /* ---- class records: the teacher's wall, the ready queue, tests, the class list ---- */
    function renderRecords() {
      const names = state.roster, shown = tunes();
      const ready = []; for (const t of shown) for (const n of names) if (stateOf(t.id, n) === 'ready') ready.push([n, t]);
      const passes = shown.reduce((s, t) => s + names.filter(n => stateOf(t.id, n) === 'passed').length, 0);
      $('#recsum').textContent = names.length ? `${names.length} students · ${passes} passes${ready.length ? ` · ${ready.length} ready to show` : ''}` : 'class list, passes, tests';
      if (ready.length && !$('#records').open) $('#records').open = true;
      const v = $('#recview'); v.innerHTML = '';
      const tools = document.createElement('div'); tools.className = 'tools';
      tools.innerHTML = `<button id="roster">Class list</button><button id="report" title="A spreadsheet of every student's level, passes per level and assessments">Export levels and results</button>`;
      tools.querySelector('#roster').addEventListener('click', openRoster);
      tools.querySelector('#report').addEventListener('click', exportReport);
      v.appendChild(tools);
      const sum = document.createElement('div'); sum.className = 'summary';
      sum.textContent = names.length ? `Tap a student's name on a tune to mark it passed, tap again to clear. A level is done at half its tunes passed.` : `Add names with Class list: each student can then practise as themselves, and you can assess them.`;
      v.appendChild(sum);
      if (ready.length) {
        const q = document.createElement('section'); q.className = 'queue';
        q.innerHTML = `<h2>Ready to show</h2>`;
        for (const [n, t] of ready) {
          const row = document.createElement('div'); row.className = 'row';
          row.innerHTML = `<span class="what"><b>${esc(n)}</b>: ${esc(t.title)}<small>level ${t.level}</small></span><button class="open">Assess</button><button class="not">Not yet</button><button class="pass">Passed ✓</button>`;
          row.querySelector('.open').addEventListener('click', () => { setStudent(n); openPiece(t, 'assess'); });
          row.querySelector('.not').addEventListener('click', () => { setState(t.id, n, 'practising'); render(); });
          row.querySelector('.pass').addEventListener('click', () => { setState(t.id, n, 'passed'); render(); toast(`${n} passed ${t.title}`); });
          q.appendChild(row);
        }
        v.appendChild(q);
      }
      const allTests = names.flatMap(n => testsOf(n).map(t => ({ ...t, name: n }))).sort((a, b) => b.date.localeCompare(a.date));
      if (allTests.length) {
        const d = document.createElement('details'); d.className = 'tests';
        d.innerHTML = `<summary>Assessments: ${allTests.length}</summary>${testTable(allTests.slice(0, 60))}${allTests.length > 60 ? '<p class="note">The export has them all.</p>' : ''}`;
        v.appendChild(d);
      }
      if (!names.length) return;
      const legend = document.createElement('div'); legend.className = 'legend';
      legend.innerHTML = `<span><i style="border-color:var(--prac)"></i>practising</span><span><i style="background:var(--ready)"></i>ready to show</span><span><i style="background:var(--pass)"></i>passed</span>`;
      v.appendChild(legend);
      const wall = document.createElement('div'); wall.className = 'wall';
      for (let l = 1; l <= 6; l++) {
        const here = tunesAt(l); if (!here.length) continue;
        const col = document.createElement('section'); col.className = 'col';
        const at = names.filter(n => currentLevel(n) === l).length;
        col.innerHTML = `<h2>${tape(l)}Level ${l}<small>${at} student${at === 1 ? '' : 's'} here</small></h2>`;
        for (const t of here) {
          const row = document.createElement('div'); row.className = 'row-tune';
          row.innerHTML = `<span class="t"><a href="${esc(pieceUrl(t, 'teach'))}">${esc(t.title)}</a></span>`;
          for (const n of names) {
            const s = stateOf(t.id, n), b = document.createElement('button'); b.className = 'chip' + (s ? ' ' + s : ''); b.textContent = n; b.title = `${n}: ${s || 'not started'}`;
            b.addEventListener('click', () => { setState(t.id, n, s === 'passed' ? '' : 'passed'); render(); });
            row.appendChild(b);
          }
          col.appendChild(row);
        }
        wall.appendChild(col);
      }
      v.appendChild(wall);
    }
    const resPill = t => t.result ? `<span class="res ${t.result}">${esc(P.RESULTS[t.result])}</span>${t.mark ? ` <span class="res m${t.mark}">${t.mark}</span>` : ''}` : t.mark ? `<span class="res m${t.mark}">Level ${t.mark}</span>` : '';
    const testTable = tests => `<table><tr><th>Student</th><th>Date</th><th>Piece</th><th>Result</th><th>Tempo</th><th>Help</th><th>Note</th></tr>${tests.map(t => `<tr><td>${esc(t.name)}</td><td>${esc(t.date)}</td><td>${esc(t.title)}${t.phrase ? ` <small>(loop ${t.phrase})</small>` : ''}</td><td>${resPill(t)}</td><td>${t.bpm ? `${t.bpm}${t.written ? ` of ${t.written}` : ''}` : ''}</td><td>${esc(t.assist ? P.ASSISTS[t.assist] || '' : '')}</td><td>${esc(t.note || '')}</td></tr>`).join('')}</table>`;
    function drawPiece(name) {
      const lvl = currentLevel(name) || 6;
      const at = tunesAt(lvl), notPassed = at.filter(t => stateOf(t.id, name) !== 'passed');
      const fresh = notPassed.filter(t => !testsOf(name).some(x => x.id === t.id));
      const pool = fresh.length ? fresh : notPassed.length ? notPassed : at;
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }

    /* ---- the report: one row per student, then every assessment ---- */
    function exportReport() {
      const q = v => { const s = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
      const rows = [['Student', 'Current level', 'Chosen level', ...[1, 2, 3, 4, 5, 6].map(l => `Level ${l} passed of ${tunesAt(l).length}`), 'Tunes practising', 'Tunes ready', 'Assessments', 'Latest date', 'Latest piece', 'Latest result', 'Latest note']];
      for (const n of state.roster) {
        const ts = testsOf(n), last = ts[ts.length - 1];
        rows.push([n, currentLevel(n) || 'all done', state.levels[n] || '', ...[1, 2, 3, 4, 5, 6].map(l => passedAt(l, n)), tunes().filter(t => stateOf(t.id, n) === 'practising').length, tunes().filter(t => stateOf(t.id, n) === 'ready').length, ts.length, last ? last.date : '', last ? last.title : '', last ? P.resultWords(last) : '', last ? last.note || '' : '']);
      }
      rows.push([], ['Assessments'], ['Student', 'Date', 'Piece', 'Level', 'Loop', 'Result', 'Achievement (1-4)', 'Tempo', 'Written tempo', 'Help', 'Note', 'Flags kept']);
      for (const n of state.roster) for (const t of testsOf(n)) rows.push([n, t.date, t.title, t.level, t.phrase || '', t.result ? P.RESULTS[t.result] : '', t.mark || '', t.bpm || '', t.written || '', t.assist ? P.ASSISTS[t.assist] : '', t.note || '', (t.flags || []).filter(f => f.kept).length || '']);
      rows.push([], ['Tunes in the set'], ['Level', 'Tune', 'Key', 'Metre', 'Ontario grade', 'Passed by']);
      for (const t of set.tunes) rows.push([t.level, t.title, t.key, t.metre, t.ontario ? t.ontario.grade : '', state.roster.filter(n => stateOf(t.id, n) === 'passed').join('; ')]);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n') + '\n'], { type: 'text/csv;charset=utf-8' }));
      a.download = `practice-board-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
      toast('Report saved');
    }

    // abcjs loads deferred; draw incipits once it is here, a few per frame.
    const queue = [];
    function queueRender(el, abc) { queue.push([el, abc]); drain(); }
    let draining = false;
    function drain() {
      if (draining || !window.ABCJS) return; draining = true;
      const step = () => {
        for (let i = 0; i < 4 && queue.length; i++) {
          const [el, abc] = queue.shift();
          if (!el.isConnected) continue;
          try { ABCJS.renderAbc(el, abc, { scale: 0.62, staffwidth: Math.max(180, el.clientWidth - 8), paddingtop: 0, paddingbottom: 0, paddingleft: 0, paddingright: 0, responsive: 'resize' }); } catch (e) { el.textContent = ''; }
        }
        if (queue.length) requestAnimationFrame(step); else draining = false;
      };
      requestAnimationFrame(step);
    }

    /* ---- class list dialog, export and import ---- */
    const dlg = $('#rosterDlg');
    function openRoster() { $('#names').value = state.roster.join('\n'); dlg.showModal(); }
    $('#cancel').addEventListener('click', () => dlg.close());
    $('#saveRoster').addEventListener('click', () => {
      state.roster = [...new Set($('#names').value.split('\n').map(s => s.trim()).filter(Boolean))];
      persist(); dlg.close(); render();
    });
    $('#export').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ set: set.name, ...state }, null, 1)], { type: 'application/json' }));
      a.download = 'practice-board.json'; a.click(); URL.revokeObjectURL(a.href);
    });
    $('#import').addEventListener('click', () => $('#file').click());
    $('#file').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const j = JSON.parse(await f.text());
        if (!Array.isArray(j.roster)) throw new Error('no roster');
        state.roster = [...new Set([...state.roster, ...j.roster])];
        for (const [id, m] of Object.entries(j.progress || {})) state.progress[id] = { ...(state.progress[id] || {}), ...m };
        Object.assign(state.levels, j.levels || {});
        for (const [n, ts] of Object.entries(j.tests || {})) { const have = state.tests[n] || (state.tests[n] = []); for (const t of ts) if (!have.some(x => x.date === t.date && x.id === t.id && x.result === t.result && x.mark === t.mark)) have.push(t); have.sort((a, b) => a.date.localeCompare(b.date)); }
        for (const [id, m] of Object.entries(j.sends || {}))                     // an export from the first board
          for (const [name, date] of Object.entries(m)) (state.progress[id] || (state.progress[id] = {}))[name] = { state: 'passed', date };
        persist(); dlg.close(); render(); toast('Imported');
      } catch (err) { toast('That file is not a practice board export'); }
      e.target.value = '';
    });
    for (const b of document.querySelectorAll('.ways button')) b.addEventListener('click', () => { way = b.dataset.do; if (way !== 'teach' && student) level = currentLevel(student) || level; render(); });
    let toastTimer;
    function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400); }

    /* ---- go ---- */
    // Served, the board fetches set.json; opened from disk, where a page may not fetch, it uses the copy in sets.js (node course/build-sets.js).
    const ready = document.readyState === 'complete' ? Promise.resolve() : new Promise(r => window.addEventListener('load', r));
    fetch('set.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .catch(err => ready.then(() => { if (window.GCS_SETS && window.GCS_SETS.tunes) return window.GCS_SETS.tunes; throw err; }))
      .then(s => ready.then(() => s))
      .then(s => {
        set = s; P = window.GCSPractice;
        const b = P.decodeBoard(location.hash);
        way = b.do || 'teach'; level = b.level || null; chosen = b.tune && set.tunes.some(t => t.id === b.tune) ? b.tune : '';
        if (chosen && !level) level = set.tunes.find(t => t.id === chosen).level;
        render(); drain();
      })
      .catch(err => { $('#view').innerHTML = `<p class="note">${location.protocol === 'file:' ? 'The board found no tunes: opened from disk it reads course/sets.js, which node course/build-sets.js writes; or serve the folder (double-click serve.command) and open course/board.html from there.' : `Could not load set.json (${esc(err.message)}).`}</p>`; });
    window.addEventListener('hashchange', () => { if (!P || !set) return; const b = P.decodeBoard(location.hash); way = b.do || way; level = b.level || level; chosen = b.tune || ''; render(); });
  </script>
</body>
</html>
