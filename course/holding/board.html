<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tune workshop · Grand Central Stationery</title>
<style>
:root{color-scheme:light dark;--bg:#f4f1e9;--card:#fffdf8;--ink:#24211d;--muted:#70695f;--line:#c9bfae;--accent:#77541f} @media(prefers-color-scheme:dark){:root{--bg:#171613;--card:#24211d;--ink:#f4efe5;--muted:#b4aa9b;--line:#51493d;--accent:#e2ba72}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}header{padding:20px 24px 12px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}h1{margin:0;font-family:Georgia,serif;font-weight:500}header a{color:var(--accent)}header p{margin:0;color:var(--muted)}main{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;padding:12px 24px 28px;overflow:auto;align-items:start}.column{border-top:3px solid var(--accent);min-height:180px}.column h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin:10px 4px;color:var(--muted)}.count{float:right}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:9px 0;box-shadow:0 2px 8px #0001}.card h3{margin:0 0 2px;font-size:17px}.sub,.source,.meta,.blocked{color:var(--muted);font-size:13px}.source{margin:8px 0}.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 8px}.blocked{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.card a{color:var(--accent)}.empty{color:var(--muted);padding:10px 4px}.dossier{font-size:13px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}.dossier summary{cursor:pointer;color:var(--accent)}.dossier p{margin:4px 0}.dossier ol{margin:4px 0;padding-left:20px}.dossier li{margin:3px 0}.verdict{float:right;font-size:12px;border:1px solid currentColor;border-radius:999px;padding:0 8px;margin-left:6px}.verdict.include{color:#3d8a4a}.verdict.reject{color:#c0483a}.card.reject{opacity:.6}.verdict.fragment{color:var(--muted)}.kindnote{font-size:13px;color:var(--muted);margin:6px 0 0}.resp{font-size:13px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px;white-space:pre-wrap}.error{margin:24px;padding:16px;border:1px solid #b33;background:#b331;color:white;border-radius:8px}@media(max-width:800px){main{grid-template-columns:repeat(5,82vw);scroll-snap-type:x mandatory}.column{scroll-snap-align:start}header{padding-inline:16px}main{padding-inline:16px}}
</style>
</head>
<body><header><h1>Tune workshop</h1><a href="../board.html">Practice board</a><a href="../review/board.html">Review queue</a><a href="../editor.html">Tune editor</a><a href="../../index.html">Main page</a><p>Drafts wait here until both the source and the classroom have checked them.</p></header><main id="board"></main>
<script src="../reviewer-outreach.js"></script><script>
const names={inbox:'Inbox',transcription:'Transcribing','source-check':'Source check','classroom-check':'Classroom check',ready:'Ready to publish'};
const verdicts={include:'Include',reject:'Rejected'};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('index.json').then(r=>{if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}).then(data=>{
  const board=document.getElementById('board');
  for(const stage of data.stages){const items=data.items.filter(x=>x.status===stage),col=document.createElement('section');col.className='column';col.innerHTML=`<h2>${esc(names[stage])}<span class="count">${items.length}</span></h2>`;
    if(!items.length)col.insertAdjacentHTML('beforeend','<div class="empty">Nothing waiting</div>');
    for(const it of items)col.insertAdjacentHTML('beforeend',`<article class="card ${esc(it.decision)}" data-tune-id="${esc(it.id)}"><h3>${it.kind==='fragment'?`<span class="verdict fragment" title="A fragment: ${esc(it.kindNote)}">Fragment</span>`:it.kind==='link'?`<span class="verdict fragment" title="Link only: ${esc(it.kindNote)}">Link only</span>`:''}${verdicts[it.decision]?`<span class="verdict ${esc(it.decision)}" title="${esc(it.decisionNote)}">${verdicts[it.decision]}</span>`:''}${esc(it.title)}</h3><div class="sub">${esc(it.subtitle)}</div>${it.kind==='fragment'?`<p class="kindnote"><b>Fragment:</b> ${esc(it.kindNote)}</p>`:it.kind==='link'?`<p class="kindnote"><b>Link only:</b> ${esc(it.kindNote)}</p>`:''}<div class="source">${esc(it.source)}${(it.sourceUrls||[]).map(s=>` <a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.label)}">Original ↗</a>`).join('')}${(it.performances||[]).map(s=>` <a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.label)}">Listen ↗</a>`).join('')}</div><div class="meta"><span>Source</span><b>${esc(it.sourceCheck)}</b><span>Classroom</span><b>${esc(it.classroomCheck)}</b><span>Human review</span><b>${esc(it.reviewStatus||'not-started')}${it.reviewPacket?` · <a href="${encodeURI(it.reviewPacket)}">packet</a>`:''}</b><span>Owner</span><b>${esc(it.owner||'unclaimed')}</b><span>Updated</span><b>${esc(it.updated||'—')}</b></div>${it.blocked?`<div class="blocked"><b>Next:</b> ${esc(it.blocked)}</div>`:''}${it.dossier?`<details class="dossier"><summary>Dossier</summary>${Object.entries(it.dossier).map(([k,v])=>`<p><b>${esc(k)}</b> ${esc(v)}</p>`).join('')}</details>`:''}${(it.lesson||[]).length?`<details class="dossier"><summary>Lesson</summary><ol>${it.lesson.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>`:''}${it.decisionNote?`<div class="resp"><b>Decision note:</b> ${esc(it.decisionNote)}</div>`:''}${it.response?`<div class="resp"><b>Your response:</b> ${esc(it.response)}</div>`:''}<p><a href="../editor.html?r=${encodeURIComponent('holding/'+it.id)}">Edit</a> · <a href="${encodeURI(it.file)}">Open ABC</a></p></article>`);
    board.appendChild(col);
  }
  if(window.GCSOutreach)window.GCSOutreach.attach('holding');
}).catch(e=>document.getElementById('board').outerHTML=`<div class="error">Could not load the workshop: ${esc(e.message)}. Serve the repository rather than opening this page directly.</div>`);
</script></body></html>
