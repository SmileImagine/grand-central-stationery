<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grand Central Stationery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)">
  <link href="fonts/fonts.css" rel="stylesheet">   <!-- local copies of the Google Fonts files -->
  <script src="vendor/abcjs-basic-min.js" id="abcjs" defer></script>   <!-- abcjs 6.7.0, vendored. defer: text cells paint before its 500 KB is parsed; notation cells finish setting up on its load event -->
  <script src="vendor/impress.js" defer></script>     <!-- impress.js 2.0.0, vendored: 3D present mode. defer: it touches document.body while loading -->
  <style>
    /* Zero-advance ♯ and ♭ (see ANALYSIS §8): "C♭" is exactly as wide as "C". */
    @font-face {
      font-family: 'GCS Accidentals';
      src: url(data:font/woff2;base64,d09GMgABAAAAAAKYAAoAAAAABTQAAAJOAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAABmAAPAqBPIEvATYCJAMICwgABCAFhG0HMxtsBCAeB7lJ65q1UxwiI661ZfsQPLxj/7vbvrhIFatiWbNBJnOIWsqzcs0iCLtCld3LKgKhMsk9NYAFnsdd77c80CgwbkusLdPbIjhu4Jy6sCiBBNBooEpK33Ag8R8h8Xa6nS5wi9SDH8i+OzdexwoaJiU05N5REBNtWohIA6Z+hrQx7DOq3F4cVPcdIG4OlUABK4oAVrT4AR1aBJlJptHgPY97dBcBAAAUAB2gBZJAugYAWgBAks3YqbYa8mh4eM/anVfc0ZFV6Omj7emlWD8xOLiyahRe8Y0hsTHEl5elDRJle6UWj6a/zH9s7c2fbcyTXErONLXql19+/X1g+lNPzzCA+86b3sx0zFtscdl2xE7edtR2i2mDXcTJpnd5Fvl2eTQABBB4s832bDVN+vWU+gv4/cUNmv1GsbNYjgBFAhBow0sABm/boiZChK8wYEAAxY0EIEGop8f50xpBRjA1zUi6tnYb83CIIqo+8N8BRnDJKSOZ5GmLsay858q/LRVixN3mtGQ0GtXyxK8y/6xkLq68KRPMIjwk3D9oG20o8DkEav/LSWRuv86uvatWZAS4el5mkJv5ukTbZzKcsNVfmnLD1j8NDwknl/RnlWBUEkkVjQTQwzMUKGFEBhRLggoHfiodnEEpi2iQw9AiKFLhiBYQCBcinL8gbiZxjEQEaKcJMIFYRlCJKoZGhCy50RjFJgxgShnCUHEwFxkKJ6kCv65gIdfeC6TjuIpAtIiRgidSSCTGCyaK06lBvKDKmqgLSNRSEEUorXHC6g5EAA==) format('woff2');
      unicode-range: U+266D, U+266F;
      font-weight: 100 900;   /* covers bold too: a synthetic bold smears the glyph sideways and closes the gap between the sharp's bars at large sizes */
    }
    :root {
      --font: 'GCS Accidentals', 'Atkinson Hyperlegible', 'Noto Music', system-ui, sans-serif;  /* set by the font picker */
      --mono: 'Atkinson Hyperlegible Mono', ui-monospace, Menlo, monospace;
      --ui: 13px system-ui, sans-serif;
      --lh: 1.1;
      --ink: #222; --bg: #fff; --panel: #fafafa; --panel-2: #fff; --line: #ddd; --line-2: #eee; --muted: #777;
      --caret: #aaa; --accent: #087fca; --cursor: #f39322;
      --text-cell-h: 34vh;      /* edit-mode heights */
      --abc-cell-h: 46vh;
      --acc-size: 1.8;          /* notation: accidental height in noteheads */
      --lyric-min: 9;           /* notation: lyric layout size; abcjs widens only where a syllable exceeds it */
      --lyric-max: 20;
    }
    :root[data-theme="dark"] {
      --ink: #eaeaea; --bg: #111; --panel: #1b1b1b; --panel-2: #161616; --line: #333; --line-2: #2a2a2a; --muted: #999;
      --caret: #888; color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #eaeaea; --bg: #111; --panel: #1b1b1b; --panel-2: #161616; --line: #333; --line-2: #2a2a2a; --muted: #999;
        --caret: #888; color-scheme: dark;
      }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; font: var(--ui); color: var(--ink); }

    /* ---------- chrome ---------- */
    .toolbar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel); flex-wrap: wrap; position: relative; }
    /* Engraved letterhead rule: thick over thin. */
    .toolbar::after, .cell-head::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); opacity: 0.55; }
    .cell-head::after { opacity: 0.22; }
    .wordmark { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; margin-right: 22px; }
    .wordmark .mark { width: 22px; height: 27px; display: block; }
    .wordmark { position: relative; padding-bottom: 4px; }
    .wordmark .name { display: block; height: 24px; fill: currentColor; }
    .wordmark .hand { opacity: 0.85; }
    /* One drawn line under the name: a pencil stroke, tapered at both ends. */
    .wordmark::after { content: ''; position: absolute; left: 30px; right: 0; bottom: 0; height: 2px; background: currentColor; opacity: 0.7;
      clip-path: polygon(0 60%, 4% 25%, 50% 0, 96% 35%, 100% 70%, 96% 100%, 50% 80%, 4% 95%); }
    .toolbar .spacer, .cell-head .spacer { flex: 1; }
    .toolbar .group { display: inline-flex; }
    .toolbar .group button { border-radius: 0; margin-left: -1px; }
    .toolbar .group button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
    .toolbar .group button:last-child { border-radius: 0 6px 6px 0; }
    .toolbar .group button:hover { position: relative; }   /* the highlighted border on top of its neighbours */
    /* The menu: everything used occasionally lives one click away. */
    .menu { position: relative; }
    .menu summary { list-style: none; cursor: pointer; font: var(--ui); padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--ink); line-height: 1.15; }
    .menu summary::-webkit-details-marker { display: none; }
    .menu summary:hover, .menu[open] summary { border-color: var(--accent); }
    .menu .panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; display: flex; flex-direction: column; gap: 8px; min-width: 230px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
    .menu .panel hr { border: 0; border-top: 1px solid var(--line-2); margin: 0; }
    .menu .panel label { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .menu .panel label select { flex: 1; }
    .menu .panel button { text-align: left; }
    .menu .panel a.page { display: block; padding: 4px 2px; color: var(--ink); text-decoration: none; }
    .menu .panel a.page small { color: var(--muted, #777); margin-left: 6px; }
    .menu .panel a.page:hover { text-decoration: underline; }
    button, select { font: var(--ui); padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--ink); cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .cells { flex: 1; overflow: auto; padding: 12px; }
    .cell { border: 1px solid var(--line); border-radius: 8px; margin: 0 auto 12px; max-width: 1500px; background: var(--bg); }
    .cell.focused { border-color: var(--accent); }
    .cell-head { display: flex; gap: 6px; align-items: center; padding: 4px 8px 6px; color: var(--muted); position: relative; }
    .cell-head button { padding: 2px 7px; }
    .cell-head .tools { display: inline-flex; gap: 6px; }
    .cell-head .hint, .cell-head .tools, .cell-head .textopts { opacity: 0; transition: opacity 0.15s; }
    .cell:hover .cell-head .hint, .cell:hover .cell-head .tools, .cell.focused .cell-head .hint, .cell.focused .cell-head .tools,
    .cell:hover .cell-head .textopts, .cell.focused .cell-head .textopts,
    .cell-head .tools:focus-within, .cell-head .textopts:focus-within, .cell-head:focus-within .hint { opacity: 1; }
    /* A text cell's own options: its font, and centring. */
    .cell-head .textopts { display: inline-flex; gap: 6px; align-items: center; }
    .cell-head .textopts select { font: var(--ui); max-width: 13em; }
    .cell-head .textopts label { display: inline-flex; gap: 3px; align-items: center; }
    .cell-head .grip { cursor: grab; user-select: none; font-size: 15px; line-height: 1; padding: 0 2px; }
    .cell-head .grip:active { cursor: grabbing; }
    .cell-head .order { width: 3.4em; font: var(--ui); padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); color: var(--ink); text-align: center; }
    .cell.dragging { opacity: 0.4; }
    .cell.drop-before { box-shadow: 0 -4px 0 0 var(--accent); }
    .cell.drop-after { box-shadow: 0 4px 0 0 var(--accent); }
    /* Toast: quiet grey, one action, an × to dismiss early. */
    .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20; display: none; gap: 10px; align-items: center; padding: 7px 8px 7px 14px; border-radius: 8px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); font: var(--ui); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
    .toast.show { display: flex; }
    .toast button { background: transparent; color: inherit; border-color: var(--line); }
    .toast button:hover { border-color: var(--ink); }
    .toast .close { border: 0; padding: 2px 6px; font-size: 15px; line-height: 1; color: var(--muted); }
    .toast .close:hover { color: var(--ink); }
    .cell-body { position: relative; height: var(--text-cell-h); overflow: hidden; border-radius: 0 0 8px 8px; }
    .cell[data-type="abc"] .cell-body { height: var(--abc-cell-h); display: flex; flex-direction: column; }
    .cell[data-type="abc"] .cell-body.with-inst { height: var(--abc-inst-cell-h, 66vh); }   /* an instrument under the staff: the cell grows so the staff keeps its room */
    /* Rhythm and dance cells: the drawing on top, the text and transport in the strip, as in a notation cell. */
    .cell[data-type="rhythm"] .cell-body, .cell[data-type="dance"] .cell-body { height: var(--abc-cell-h); display: flex; flex-direction: column; }
    .mstage { flex: 1 1 auto; min-height: 30%; display: flex; justify-content: center; padding: 1vh 1vw; box-sizing: border-box; overflow: hidden; background: #fff; }
    .mstage svg { width: 100%; height: 100%; display: block; }
    .mstage .split { display: flex; width: 100%; gap: 10px; }
    .mstage .split > * { flex: 1; min-width: 0; }
    .views { display: inline-flex; flex-wrap: wrap; gap: 4px; }
    .views button { font: var(--ui); padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; }
    .views button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
    .cell[data-align="center"] .layer { text-align: center; }   /* vertical centring is set by the engine */
    /* Exercise-book margin: one thin rule a little in from the left of text cells. */
    .cell[data-type="text"]:not([data-align="center"]) .cell-body::before { content: ''; position: absolute; top: 0; bottom: 0; left: 0.9vw; width: 0; border-left: 1px solid var(--ink); opacity: 0.18; pointer-events: none; z-index: 3; }
    .hint { color: var(--muted); }

    /* ---------- present mode ---------- */
    body.present .toolbar, body.present .cell-head { display: none; }
    body.present .cells { padding: 0; overflow: hidden; }
    /* The concourse: a barrel-vault vignette over the stage, and at night the
       ceiling's constellations, painted backwards as they are in the terminal. */
    .vault { position: fixed; inset: 0; pointer-events: none; z-index: 8; display: none; }
    body.present .vault, body.present3d .vault { display: block; }
    .vault::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 60%, transparent 55%, rgba(0,0,0,0.07) 100%); }
    .vault .stars { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.2s; transform: scaleX(-1); }
    /* Daylight: the beams from the east windows in the 1930s photographs,
       falling from the upper right; the shade between them is the ink. */
    .vault .rays { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.05; transition: opacity 1.2s; }
    :root[data-theme="dark"] .vault .rays { opacity: 0; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .vault .rays { opacity: 0; } }
    :root[data-theme="dark"] .vault .stars { opacity: 0.13; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .vault .stars { opacity: 0.13; } }
    :root[data-theme="dark"] .vault::before { background: radial-gradient(ellipse 80% 70% at 50% 60%, transparent 55%, rgba(0,0,0,0.35) 100%); }
    body.present .cell { display: none; border: 0; border-radius: 0; margin: 0; max-width: none; }
    body.present .cell.current { display: block; }
    body.present .cell .cell-body, body.present .cell[data-type="abc"] .cell-body { height: 100vh; border-radius: 0; }
    .present-nav { position: fixed; right: 10px; bottom: 8px; z-index: 9; display: none; gap: 6px; align-items: center; opacity: 0.35; transition: opacity 0.2s; }
    .present-nav:hover { opacity: 1; }
    .present-nav input { width: 3em; font: var(--ui); padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); color: var(--ink); text-align: center; }
    body.present .present-nav { display: flex; }

    /* ---------- 3D present mode (impress.js) ---------- */
    body.present3d .toolbar, body.present3d .cell-head, body.present3d .cells { display: none; }
    body.present3d { background: var(--stage-bg, var(--bg)); transition: background 0.9s ease; }
    #impress { display: none; }
    body.present3d #impress { display: block; }
    body.present3d #impress .cell {
      width: 100vw; height: 100vh; margin: 0; max-width: none; border: 0; border-radius: 0;
      background: var(--cell-bg, var(--bg)); box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,0.25);
      transition: box-shadow 0.9s ease;
    }
    body.present3d #impress .cell.active { box-shadow: 0 0 0 1px var(--line), 0 0 0 rgba(0,0,0,0); }
    body.present3d #impress .cell { transition: box-shadow 0.9s ease, opacity 0.9s ease; }
    /* Only the active cell is shown: any cell placed in front of it in space
       fades out completely, so nothing can obscure the one being presented.
       The overview shows all. */
    body.present3d:not(.impress-on-overview) #impress .cell:not(.active) { opacity: 0; pointer-events: none; }
    body.present3d #impress .cell .cell-body, body.present3d #impress .cell[data-type="abc"] .cell-body { height: 100vh; border-radius: 0; }
    body.present3d #impress .overview { width: 100vw; height: 100vh; pointer-events: none; }
    body.present3d .present-nav { display: flex; }
    #nav3dReset { display: none; }
    body.present3d.impress-on-overview #nav3dReset { display: inline-block; }
    body.impress-enabled .impress-help { display: none; }   /* no help overlay */
    /* 3D setup: sliders for one cell at a time, over the scene. */
    #nav3dSetup { display: none; }
    body.present3d #nav3dSetup { display: inline-block; }
    .setup3d { position: fixed; left: 10px; bottom: 8px; z-index: 10; display: none; width: 330px; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: var(--ui); box-shadow: 0 6px 20px rgba(0,0,0,0.18); }
    body.present3d.setup3d-open .setup3d { display: block; }
    .setup3d .shead { display: flex; gap: 6px; align-items: center; }
    .setup3d .shead button { padding: 2px 7px; white-space: nowrap; }
    .setup3d .shead .spacer { flex: 1; }
    .setup3d .scell { font-weight: 600; min-width: 6.5em; text-align: center; }
    .setup3d .snote { margin: 4px 0 6px; color: var(--muted); }
    .setup3d .srow { display: grid; grid-template-columns: 3.6em 1fr 4.4em; gap: 6px; align-items: center; margin: 2px 0; }
    .setup3d input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
    .setup3d input[type="range"].auto { opacity: 0.5; }
    .setup3d .sval { width: 100%; box-sizing: border-box; font: var(--ui); padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); color: var(--ink); }
    .setup3d .sval::placeholder { color: var(--muted); }
    .setup3d input[type="color"] { width: 2.4em; height: 1.6em; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
    body.setup3d-open.impress-on-overview #impress .cell.setup-sel { outline: 1.5vw solid var(--accent); }

    /* ---------- text engine (three stacked layers) ---------- */
    .layer {
      position: absolute; inset: 0; margin: 0; border: 0;
      padding: 1.5vh 1.5vw; box-sizing: border-box;
      font-family: var(--font); font-weight: 700; font-size: 10vmin;
      line-height: var(--lh); white-space: pre-wrap; word-break: break-word;
      letter-spacing: 0; font-variant-ligatures: none; font-kerning: none;
      overflow: hidden;
    }
    .shadow, .inputbox { transform-origin: 0 0; }
    .shadow { color: var(--ink); z-index: 1; pointer-events: none; }
    .inputbox { color: transparent; caret-color: var(--caret); background: transparent; z-index: 2; outline: none; resize: none; }
    .measure { visibility: hidden; z-index: 0; pointer-events: none; transition: none; }
    .note { color: var(--c); }

    /* ---------- game mode (a present mode) ---------- */
    .cell:not([data-type="abc"]) .game { display: none; }
    body.game .cell[data-type="abc"] .cell-body { background: linear-gradient(160deg, #fff4e0, #e3f2fd 55%, #f3e5f5); }
    :root[data-theme="dark"] body.game .cell[data-type="abc"] .cell-body { background: linear-gradient(160deg, #1d1238, #0b2740 55%, #0f2e1e); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.game .cell[data-type="abc"] .cell-body { background: linear-gradient(160deg, #1d1238, #0b2740 55%, #0f2e1e); } }
    /* The score takes what the instrument leaves: the instrument's height follows its drawing's shape (a ukulele is low and wide, a recorder tall), between a quarter and 44 % of the screen. */
    body.game .score { flex: 1 1 auto; min-height: 20vh; padding: 0; overflow: hidden; justify-content: flex-start; align-items: center; position: relative;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
    /* Two lines: the paper is the tune wrapped to the width; it slides up a system at a time, the line being played on top and the next below. */
    body.game .score.twoline { align-items: flex-start; -webkit-mask-image: linear-gradient(180deg, transparent, #000 3%, #000 80%, transparent 92%); mask-image: linear-gradient(180deg, transparent, #000 3%, #000 80%, transparent 92%); }
    body.game .score.twoline .paper { transition: transform 0.25s ease; }
    body.game .paper { will-change: transform; }
    body.game .paper svg { color: var(--ink); }
    body.game .paper .cursorbar { width: 4px; }
    /* The instrument keeps at least a quarter of the screen whatever the dock opens: it is the point of the mode. */
    body.game .inst { flex: 0 0 auto !important; height: min(44vh, calc(96vw * var(--inst-ratio, 0.3) + 2vh)); min-height: 24vh; border-top: 0; padding: 1vh 2vw; }
    body.game .strip { height: auto; flex: 0 0 auto; min-height: 0; padding: 6px 8px; background: transparent; border-top: 0; }
    body.game .strip::before { display: none; }
    body.game .side { max-width: none; width: 100%; justify-content: center; }
    .gamebar { display: none; position: relative; height: 6px; background: var(--line); flex: 0 0 auto; }
    body.game .gamebar { display: block; }
    .gamebar .prog { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #e72829, #f39322, #f2e716, #69b944, #087fca, #79569f, #FF77A9); transition: width 0.25s linear; }
    .gamebar .count { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 2; font: 700 14vh 'Atkinson Hyperlegible', sans-serif; color: var(--cursor); opacity: 0; pointer-events: none; }
    .gamebar .count.on { animation: countpop 0.6s ease-out; }
    @keyframes countpop { 0% { opacity: 1; transform: translateX(-50%) scale(0.6); } 100% { opacity: 0; transform: translateX(-50%) scale(1.3); } }
    .gamebar .cheer { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 2; font: 700 12vh 'Atkinson Hyperlegible', sans-serif; opacity: 0; pointer-events: none; white-space: nowrap;
      background: linear-gradient(90deg, #e72829, #f39322, #f2e716, #69b944, #087fca, #79569f, #FF77A9); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .cell-body.done .cheer { animation: cheer 2.4s ease-out; }
    @keyframes cheer { 0% { opacity: 0; transform: translateX(-50%) scale(0.5); } 15% { opacity: 1; transform: translateX(-50%) scale(1.1); } 80% { opacity: 1; transform: translateX(-50%) scale(1); } 100% { opacity: 0; transform: translateX(-50%) scale(1); } }
    .cell-body.done .inst svg { animation: instglow 1.6s ease-out; }
    @keyframes instglow { 0% { filter: drop-shadow(0 0 0 transparent); } 30% { filter: drop-shadow(0 0 18px var(--cursor)); } 100% { filter: drop-shadow(0 0 0 transparent); } }
    /* ---------- notation engine ---------- */
    .score { flex: 1 1 auto; min-height: 30%; display: flex; align-items: center; justify-content: center; padding: 1vh 1vw; box-sizing: border-box; overflow: hidden; }
    .paper { line-height: 0; }
    .paper svg { display: block; }
    /* Our own additions hang off the SVG root, which abcjs gives stroke="currentColor";
       without stroke: none every letter would carry a dark one-unit outline. */
    .paper .letter { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; pointer-events: none; stroke: none; }
    .paper .accg { font-family: 'Noto Music'; pointer-events: none; stroke: none; }
    .paper .abcjs-lyric { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 400; }

    .paper .abcjs-note, .paper .abcjs-rest, .paper .abcjs-bar { transform: translate(var(--dx, 0px), 0); }

    /* Playback cursor: a bar in the colour of the sounding note with a small

    .paper .cursorg { opacity: 0.9; stroke: none; transition: opacity 0.45s ease; }

    .paper .cursorg.ready .barbeam { opacity: 0; }
    /* ---------- instrument view (under the staff) ---------- */

    @keyframes instpop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .inst .bump { fill: var(--ink); opacity: 0.45; pointer-events: none; }
    .inst .key.chord { stroke: var(--c); stroke-opacity: 0.9; stroke-width: 2; }

    .inst .runner text { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; stroke: none; pointer-events: none; }
    .paper .chordshape rect { stroke: none; }
    #tuningDlg, #pasteDlg { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 18px; max-width: 520px; width: calc(100vw - 32px); font: var(--ui); }

    #tuningDlg textarea, #pasteDlg textarea { width: 100%; min-height: 170px; box-sizing: border-box; font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }

    .bandctl { display: none; align-items: center; gap: 10px; font: var(--ui); color: var(--muted); }

    .paper .numeral text { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; stroke: none; }

    .inst .string { stroke: var(--ink); stroke-opacity: 0.8; stroke-linecap: round; }
    .inst .stringglow { stroke: var(--c, var(--ink)); stroke-linecap: round; opacity: var(--g, 0); filter: drop-shadow(0 0 5px var(--c, var(--ink))); }
    .inst .uke .strum { fill: color-mix(in srgb, var(--c, var(--ink)) calc(var(--g, 0) * 100%), var(--panel-2)); stroke: var(--ink); stroke-opacity: 0.45; stroke-width: 1; }
    .inst .uke .strum.on, .inst .uke .strum.ondeck { stroke: var(--c); stroke-opacity: var(--g, 0); filter: drop-shadow(0 0 calc(var(--g, 0) * 7px) var(--c)); }
    .inst .dot { fill: var(--c); stroke: var(--c); }
    .inst .dot.ondeck { fill: color-mix(in srgb, var(--c) 30%, var(--panel-2)); stroke-width: 2.5; stroke-dasharray: 5 3; }
    .inst .dot.active { filter: drop-shadow(0 0 6px var(--c)); animation: instpop 0.3s cubic-bezier(.2,.9,.3,1.3); transform-box: fill-box; transform-origin: center; }
    /* tablature in the staff's place */
    .paper .tabstr { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 0.9; }
    .paper .fretno { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; stroke: none; pointer-events: none; }
    .paper .tabclef { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; stroke: none; opacity: 0.7; letter-spacing: 0.05em; }
    /* The sign at the score's top left: Staff or Tab, for a fretted instrument. */
    .score { position: relative; }

    /* recorder: --c is the sounding note's colour, --n the next note's */
    .inst .rec .body { fill: color-mix(in srgb, var(--ink) 10%, var(--panel-2)); stroke: var(--ink); stroke-opacity: 0.5; stroke-width: 1.2; transition: filter 0.2s; }

    @keyframes flick { 0% { transform: scale(1); } 100% { transform: scale(1.18); } }
    .inst .rec .name { font-size: 16px; }
    .strip { height: 26%; min-height: 96px; display: flex; gap: 6px; padding: 6px; box-sizing: border-box; border-top: 1px solid var(--line); background: var(--panel); position: relative; }

      background-image: repeating-linear-gradient(45deg, var(--ink) 0 1px, transparent 1px 9px), repeating-linear-gradient(-45deg, var(--ink) 0 1px, transparent 1px 9px);
      -webkit-mask-image: linear-gradient(90deg, transparent 0 70%, #000 100%); mask-image: linear-gradient(90deg, transparent 0 70%, #000 100%); }

    .entry:focus { border-color: var(--accent); }

    .side { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; align-content: safe center; gap: 4px 14px; min-width: 300px; max-width: 46%; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; }

    /* ---------- the notation dock ----------
       Under the staff and the instrument sits one bar: the transport, the
       tempo, and three tabs (Melody, Band, Mixer). The open tab's drawer
       hangs under the bar. The melody's ABC is typed in the Melody drawer
       beside the instrument's controls; the %%band lines in the Band drawer
       beside the band's; the mixer is the third. In edit mode the Melody

    .cell[data-type="abc"] .strip.dock { flex-direction: column; height: auto; min-height: 0; max-height: 58%; padding: 0; gap: 0; font: 14px system-ui, sans-serif; }
    /* The Concourse: warm stone, brass rules, one hierarchy of signs, and
       passages that fade in rather than move the score. */
    .cell[data-type="abc"] .cell-body { --concourse-floor: #f6f0e6; --concourse-ink: #2a2622; --concourse-brass: #9c7a45; --concourse-light: #f39322; --concourse-celestial: #2f6f7e; --concourse-warn: #b8603d; background: var(--concourse-floor); color: var(--concourse-ink); }

    .dock .dockbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; padding: 6px 10px; }

    .dock .clockface .hub { fill: var(--concourse-brass); }

    .dock .clockface .playmark { fill: #fff; stroke: var(--concourse-brass); stroke-width: 1.4; filter: drop-shadow(0 0 2px #0006); }

    .dock .transport.playing .clockface .pausemark { display: block; }
    .dock .clocktempo { position: absolute; inset: auto 0 7px; text-align: center; font: 700 7px/1 'Atkinson Hyperlegible Mono', monospace; color: var(--concourse-ink); pointer-events: none; }

    .dock .departure { min-width: 12em; display: flex; flex: 0 1 28em; flex-wrap: wrap; gap: 2px 9px; align-items: baseline; color: color-mix(in srgb, var(--concourse-ink) 65%, transparent); font: 12px/1.2 Cinzel, Georgia, serif; letter-spacing: 0.12em; text-transform: uppercase; }
    .dock .departure strong { flex-basis: 100%; color: var(--concourse-ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28em; }

    .dock .tabs .tab .badge:empty { display: none; }
    .dock .drawer { flex: 1 1 auto; flex-basis: auto; min-height: 0; display: flex; flex-wrap: nowrap; align-items: stretch; gap: 10px; padding: 8px 10px; border-top: 0; overflow: hidden auto; overscroll-behavior: contain; background: color-mix(in srgb, var(--concourse-floor) 82%, var(--concourse-ink)); animation: passagefade 0.15s ease-out; }

    .dock .melodytext { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    /* The hints live in the text box like a linter's: a mirror of the text behind the box carries wavy underlines
       (red to check, grey tips); pointing at one, or putting the caret in it, opens its hint just under it, and the
       count in the box's corner opens every hint. Both float over the page (popovers), so nothing moves the layout.
       The wrapper carries the box's font, so its height is in the box's lines, and the box and mirror fill it exactly. */
    /* The frame is the wrapper's: the text above, a thin strip along its foot with the count of hints. */
    .dock .editwrap { position: relative; flex: 1 1 auto; min-height: calc(2 * 1.3em + 28px); box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); font: 700 clamp(12px, 2.6vh, 24px)/1.3 var(--mono); }
    .dock .editwrap:focus-within { border-color: var(--accent); }
    .dock .editwrap .entry, .dock .lintmirror { position: absolute; inset: 0 0 18px 0; width: 100%; height: calc(100% - 18px); min-height: 0; margin: 0; box-sizing: border-box; border: 0; border-radius: 6px 6px 0 0; padding: 4px 8px; font: inherit; white-space: pre; }
    .dock .editwrap .entry { background: transparent; }
    .dock .lintmirror { color: transparent; background: transparent; overflow: hidden; pointer-events: none; }
    .dock .lintmirror mark { color: transparent; background: transparent; text-decoration: underline wavy #d33 1.5px; text-decoration-skip-ink: none; text-underline-offset: 3px; }
    .dock .lintmirror mark.tip { text-decoration-color: color-mix(in srgb, var(--muted) 80%, transparent); }
    .dock .lintmirror mark.at { background: color-mix(in srgb, #d33 16%, transparent); }
    .dock .lintmirror mark.tip.at { background: color-mix(in srgb, var(--muted) 20%, transparent); }
    .dock .editwrap .lintall { position: absolute; right: 4px; bottom: 1px; height: 16px; padding: 0 6px; border: 0; border-radius: 8px; font: 11px/16px system-ui, sans-serif; color: var(--muted); background: transparent; white-space: nowrap; cursor: pointer; }
    .dock .editwrap .lintall.warn { color: var(--concourse-warn, #d33); }
    .dock .editwrap .lintall:hover { color: var(--ink); }
    .dock .editwrap .lintall[hidden] { display: none; }
    .dock .linttip, .dock .lintlist { position: fixed; inset: auto; margin: 0; box-sizing: border-box; padding: 6px 9px; border: 1px solid color-mix(in srgb, var(--concourse-brass) 60%, transparent); border-radius: 8px; background: var(--panel); color: var(--ink); box-shadow: 0 6px 18px #0004; font: 12.5px/1.4 system-ui, sans-serif; max-height: none; overflow: auto; }
    .dock .linttip { max-width: min(30em, 92vw); }
    .dock .linttip .w + .w, .dock .lintlist .w + .w { border-top: 1px solid var(--line); }
    .dock .linttip.warn, .dock .lintlist .warn { font: 12.5px/1.4 system-ui, sans-serif; color: inherit; max-height: none; order: 0; overflow: visible; }
    .dock .linttip .why, .dock .lintlist .why { font-size: 11px; border: 1px solid currentColor; }
    .dock .linttip .w, .dock .lintlist .w { color: var(--concourse-warn, #d33); }
    .dock .linttip .w.tip, .dock .lintlist .w.tip { color: var(--muted); }
    .dock .lintlist { width: min(34em, 92vw); max-height: 50vh; padding-top: 0; }
    .dock .lintlist .linthead { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 5px 0 4px; background: var(--panel); color: var(--muted); font: 600 11px/1 Cinzel, Georgia, serif; letter-spacing: 0.12em; text-transform: uppercase; }
    .dock .lintlist .lintclose { border: 0; background: transparent; color: var(--muted); font: 16px/1 system-ui, sans-serif; padding: 0 2px; }
    .dock .lintlist .w.placed .msg { cursor: pointer; text-decoration: underline dotted color-mix(in srgb, currentColor 50%, transparent); text-underline-offset: 3px; }
    .dock .lintlist .lintundo { margin: 6px 0 2px; font: 12px system-ui, sans-serif; padding: 2px 8px; }
    /* The Band box: the arrangement as typed, and under it, grey, the pattern the sliders write for any part not typed;
       a mirror behind the box draws both, and while the band plays it lights the word that is sounding. The foot of
       the box says what that word became, or how the grey lines work, with Back to the sliders when the pattern is typed. */
    .dock .bandwrap { position: relative; flex: 1 1 0; min-width: 0; min-height: calc(2 * 1.35em + 28px); box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); font: 600 clamp(12px, 2.2vh, 18px)/1.35 var(--mono); }
    .dock .bandwrap:focus-within { border-color: var(--accent); }
    .dock .bandwrap .bandentry, .dock .bandmirror { position: absolute; inset: 0 0 18px 0; width: 100%; height: calc(100% - 18px); min-height: 0; margin: 0; box-sizing: border-box; border: 0; border-radius: 6px 6px 0 0; padding: 4px 8px; font: inherit; white-space: pre; }
    .dock .bandwrap .bandentry { color: transparent; caret-color: var(--ink); background: transparent; resize: none; outline: none; overflow: auto; }
    .dock .bandmirror { color: var(--ink); background: transparent; overflow: hidden; pointer-events: none; }
    .dock .bandmirror .g { color: color-mix(in srgb, var(--muted) 80%, transparent); }
    .dock .bandmirror mark { color: inherit; border-radius: 3px; background: color-mix(in srgb, var(--accent) 35%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent); }
    .dock .bandmirror mark.drums { background: color-mix(in srgb, #e0a030 40%, transparent); box-shadow: 0 0 0 1px #e0a030; }
    .dock .bandmirror mark.bass { background: color-mix(in srgb, #4a8fd8 40%, transparent); box-shadow: 0 0 0 1px #4a8fd8; }
    .dock .bandmirror mark.chords { background: color-mix(in srgb, #5cb85c 40%, transparent); box-shadow: 0 0 0 1px #5cb85c; }
    .dock .bandfoot { position: absolute; left: 8px; right: 4px; bottom: 1px; height: 16px; display: flex; align-items: center; gap: 8px; font: 11px/16px system-ui, sans-serif; color: var(--muted); }
    .dock .bandlive { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dock .bandlive.err { color: var(--concourse-warn, #d33); }
    .dock .bandlive span + span { margin-left: 12px; }
    .dock .bandlive b { font-weight: 600; }
    .dock .bandlive .drums b { color: #d09020; } .dock .bandlive .bass b { color: #4a8fd8; } .dock .bandlive .chords b { color: #4fae4f; }
    .dock .bandfoot .patreset { flex: 0 0 auto; height: 16px; padding: 0 4px; border: 0; background: transparent; color: var(--muted); font: inherit; text-decoration: underline dotted; text-underline-offset: 2px; }
    .dock .bandfoot .patreset:hover { color: var(--ink); }
    .dock .bandfoot .patreset[hidden] { display: none; }
    .dock .bandentry::placeholder, .dock .entry::placeholder { color: var(--muted); opacity: 0.8; font-weight: 400; }
    .dock .ctl { flex: 0 1 auto; display: flex; flex-wrap: wrap; align-content: flex-start; align-items: center; gap: 6px 14px; max-width: 48%; overflow-y: auto; overscroll-behavior: contain; }
    .dock .ctl .xpose { white-space: nowrap; }
    .dock .bandctl { display: none; flex-wrap: wrap; align-items: center; gap: 6px 14px; font: inherit; }
    .dock .bandctl.on { display: flex; }
    .dock .bandctl input[type="range"], .dock .feel input[type="range"] { width: 90px; }
    .dock .bandctl .arrange, .dock .bandctl .sharecopy, .dock .bandctl .sharepaste, .dock .bandctl .regen { font: inherit; padding: 4px 12px; border-radius: 6px; }
    .dock .bandnote { flex-basis: 100%; font: 13px/1.35 system-ui, sans-serif; color: var(--muted); }
    .dock .bandnote.err { color: var(--concourse-warn); }
    .dock .bandnote:empty { display: none; }
    .dock .drawer.bandd .bandwrap, .dock .drawer.bandd .ctl { flex: 1 1 0; max-width: none; }
    /* The members sit at the drawer's foot by an auto top margin, not flex-end: in a drawer shorter than they are, they
       then overflow downwards, where it scrolls, instead of upwards under the drawer above with their sliders cut off. */
    .dock .mixer { justify-content: center; align-items: flex-start; gap: 22px; padding: 8px 10px 10px; }
    .dock .mixer .member { margin-top: auto; }
    .cell[data-type="abc"] .cell-body { --abc-cell-h: 50vh; }
    /* Presenting: the bar alone, larger, clear of the slide selector in the corner; a drawer that opens is capped so the staff keeps its room. */
    body.present .cell[data-type="abc"] .strip.dock { height: auto; max-height: 46vh; padding-right: 0; }
    body.present .dock .dockbar { padding: 8px 160px 8px 14px; font-size: 15px; }
    body.present .dock .tbtn { width: 46px; height: 46px; }
    body.game .cell[data-type="abc"] .strip.dock { max-height: 40vh; background: transparent; }
    body.game .dock .dockbar { background: color-mix(in srgb, var(--bg) 55%, transparent); border-radius: 12px; margin: 2px 10px 6px; }
    body.game .dock .drawer { background: color-mix(in srgb, var(--bg) 70%, transparent); border-radius: 12px; margin: 0 10px 8px; padding-top: 8px; }
    .cell[data-type="abc"] .score .nextup { position: absolute; z-index: 3; left: 50%; top: 5px; transform: translateX(-50%); max-width: 65%; color: color-mix(in srgb, var(--concourse-ink) 62%, transparent); font: 600 12px/1.2 Cinzel, Georgia, serif; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell[data-type="abc"] .score .nextup:empty { display: none; }
    .cell[data-type="abc"] .score .nextup.flip { animation: flap 0.18s ease-out; }
    .cell[data-type="abc"] .inst .board { fill: color-mix(in srgb, #57351f 62%, var(--concourse-floor)); }
    .cell[data-type="abc"] .inst .key, .cell[data-type="abc"] .inst .bell { filter: drop-shadow(0 3px 3px #0002); }
    .cell[data-type="abc"] .cell-body.is-playing .drawer { opacity: 0.25; }
    .cell[data-type="abc"] .cell-body.is-playing .drawer:hover, .cell[data-type="abc"] .cell-body.is-playing .drawer:focus-within { opacity: 1; }
    body.present .cell[data-type="abc"] .dock { opacity: 0.6; }
    body.present .cell[data-type="abc"] .cell-body.is-playing .dock { opacity: 0.25; transition-delay: 3s; }
    body.present .cell[data-type="abc"] .cell-body.is-playing .dock:hover, body.present .cell[data-type="abc"] .cell-body.is-playing .dock:focus-within { opacity: 0.6; transition-delay: 0s; }
    body.game .cell[data-type="abc"] .score, body.game .cell[data-type="abc"] .inst { opacity: 1; }
    /* Draggable cursor: a wide invisible handle around the bar. */
    .paper .cursorg { cursor: ew-resize; }
    .paper .cursorhit { fill: transparent; pointer-events: all; }
    .paper .cursorbar, .paper .cursorlamp { pointer-events: none; }   /* the handle beneath takes the drag */
    .hidden { position: absolute; left: -100000px; top: 0; width: 1000px; visibility: hidden; }

    /* ---------- small screens and touch ---------- */
    @media (pointer: coarse) {
      /* No hover on touch: a cell's tools are always there. */
      .cell-head .hint, .cell-head .tools, .cell-head .textopts { opacity: 1; }
      .cell-head button, .toolbar button, .menu summary { padding: 6px 10px; }
      .paper .cursorhit { width: 28px; x: -13px; }
    }
    @media (max-width: 700px) {
      .toolbar { gap: 6px; padding: 6px 8px; }
      .wordmark { margin-right: 4px; }
      .wordmark .name { display: none; }          /* the mark alone; the name would wrap the bar */
      .toolbar .group button { padding: 4px 7px; }
      .cells { padding: 8px 6px; }
      .cell { margin-bottom: 8px; }
      .cell-head { flex-wrap: wrap; row-gap: 4px; }
      .cell-head .hint { display: none; }
      .cell-head .order { width: 2.6em; }
      .menu .panel { right: -8px; min-width: min(260px, calc(100vw - 16px)); }
      /* Notation: the transport goes under the ABC text instead of beside it. */
      .strip { flex-direction: column; height: auto; min-height: 0; max-height: 46%; }
      .entry { min-height: 3.2em; }
      .side { min-width: 0; max-width: none; gap: 4px 10px; }
      .side .audio { gap: 4px 10px; }
      .cell[data-type="abc"] .cell-body { height: 56vh; }
      /* The dock on a phone: the controls wrap under the text instead of beside it. */
      .cell[data-type="abc"] .strip.dock { max-height: 60%; }
      .dock .drawer { flex-wrap: wrap; overflow-y: auto; }
      .dock .ctl, .dock .drawer.bandd .ctl { flex: 1 1 100%; max-width: none; overflow: visible; }
      .dock .melodytext, .dock .bandwrap { flex: 1 1 100%; }
      .dock .dockbar { gap: 4px 10px; padding: 6px 8px; }
      .dock .dockbar .tabs { margin-left: 0; }
      .setup3d { left: 6px; right: 6px; width: auto; bottom: 6px; max-height: 52vh; overflow-y: auto; }
      .present-nav { right: 6px; bottom: 6px; }
      .present-nav input { width: 2.6em; }
      .toast { left: 8px; right: 8px; transform: none; justify-content: space-between; }
      /* Presenting on a phone: the strip takes what it needs, and the nav moves to the top corner, clear of it. */
      body.present .strip { height: auto; max-height: 40vh; }
      body.present .present-nav, body.present3d .present-nav { bottom: auto; top: 6px; }
    }
    @media (max-width: 700px) and (orientation: landscape) {
      .cell-body { height: 60vh; }
    }

  <script>
  (() => {
    'use strict';

    /* ======================================================================
       Shared: ChromaNotes palette and accidental helpers
       ====================================================================== */
    const COLORS = {
      'C': '#e72829', 'C#': '#ef5523', 'Db': '#ef5523',
      'D': '#f39322', 'D#': '#ffd259', 'Eb': '#ffd259',
      'E': '#f2e716', 'E#': '#69b944', 'Fb': '#f2e716',
      'F': '#69b944', 'F#': '#53cf84', 'Gb': '#53cf84',
      'G': '#019696', 'G#': '#087fca', 'Ab': '#087fca',
      'A': '#79569f', 'A#': '#9f5a8f', 'Bb': '#9f5a8f',
      'B': '#FF77A9', 'Cb': '#ec6ca4', 'B#': '#e72829'
    };
    const PC_COLORS = ['#e72829', '#ef5523', '#f39322', '#ffd259', '#f2e716', '#69b944',
                       '#53cf84', '#019696', '#087fca', '#79569f', '#9f5a8f', '#FF77A9'];
    const SHARP = '\u266F', FLAT = '\u266D';
    const toAscii  = { '#': '#', 'b': 'b', [SHARP]: '#', [FLAT]: 'b' };
    const toSymbol = { '#': SHARP, 'b': FLAT };
    const cssNum = (name, dflt) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || dflt;
    const escapeHTML = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

    // "Ab" is A-flat, "About" is A + "bout": an accidental unless a lowercase letter follows.
    function normalizeAccidentals(text) {
      return text.replace(/([A-G])([#b\u266F\u266D])(?=([a-z]?))/g,
        (m, note, acc, next) => note + (next ? toAscii[acc] : toSymbol[toAscii[acc]]));
    }
    function renderColouredText(text) {
      const html = escapeHTML(text).replace(/([A-G])([#b\u266F\u266D])?/g, (m, note, accRaw, offset, str) => {
        const nextIsLower = /[a-z]/.test(str[offset + 2] || '');
        const acc  = accRaw && !nextIsLower ? accRaw : '';
        const tail = accRaw && nextIsLower ? accRaw : '';
        const color = COLORS[note + (acc ? toAscii[acc] : '')];
        if (!color) return m;
        // Letter and accidental share one span. WebKit does not paint an
        // inline box whose width is zero (the accidental glyph has no
        // advance), so a span of its own made ♯ and ♭ invisible in Safari.
        return `<span class="note" style="--c:${color}">${note}${acc}</span>${tail}`;
      });
      return html + '\u200b';    // makes a div count trailing newlines like a textarea does
    }

    /* ======================================================================
       Text engine (from Proportional v1): canvas-measured greedy wrap,
       binary search on size, transform-scale animation, shadow layer.
       ====================================================================== */
    const FONTS = {
      hyperlegible:     { family: 'Atkinson Hyperlegible',      label: 'Atkinson Hyperlegible' },
      hyperlegibleNext: { family: 'Atkinson Hyperlegible Next', label: 'Atkinson Hyperlegible Next' },
      hyperlegibleMono: { family: 'Atkinson Hyperlegible Mono', label: 'Atkinson Hyperlegible Mono' },
      lexend:           { family: 'Lexend',                     label: 'Lexend' },
      andika:           { family: 'Andika',                     label: 'Andika (SIL literacy)' },
    };
    const ACC_FONT = 'Noto Music', ACC_GLYPH_FONT = 'GCS Accidentals';

const META = new Set(['title', 'bpm', 'tempo', 'style', 'source', 'licence', 'license', 'id', 'origin', 'difficulty', 'note']);
function parseRhythm(text) {
  const r = { meter: [4, 4], rows: [], problems: [] };
  text.split('\n').forEach((raw, li) => {
    const line = raw.replace(/\/\/.*$/, '').trim(); if (!line) return;
    const m = line.match(/^([a-z][a-z0-9 ]*?)\s*:\s*(.*)$/i);
    if (!m) { r.problems.push(`Line ${li + 1}: wants "name: steps".`); return; }
    const name = m[1].trim().toLowerCase(), body = m[2].trim();
    if (name === 'meter') { const mm = body.match(/^(\d+)\s*\/\s*(\d+)$/); if (mm) r.meter = [+mm[1], +mm[2]]; else r.problems.push(`Line ${li + 1}: meter wants 4/4 or 3/4.`); return; }
    if (META.has(name)) { (r.meta = r.meta || {})[name] = body; return; }
    if (DANCE_KEYS.has(name.split(' ')[0])) return;   // a dance's own lines (pose definitions too), when both live in one text
    const bars = body.split('|').map(b => b.replace(/\s+/g, '')).filter(b => b.length);
    if (!bars.length) { r.problems.push(`Line ${li + 1}: ${name} has no steps.`); return; }
    const bad = bars.join('').replace(/[xXo.\-]/g, ''); if (bad) r.problems.push(`Line ${li + 1}: ${name} has "${bad[0]}"; steps are x X o and . only.`);
    const key = name.split(' ')[0]; const sound = SOUNDS[key];
    if (!sound) r.problems.push(`Line ${li + 1}: no sound called "${name}" (a tom plays instead).`);
    r.rows.push({ name, sound: sound || 'tom', bars: bars.map(b => [...b].map(c => c === 'x' ? 1 : c === 'X' ? 1.25 : c === 'o' ? .5 : 0)), colour: COLOURS[r.rows.length % COLOURS.length] });
  });
  r.beats = r.meter[0]; r.bars = Math.max(1, ...r.rows.map(x => x.bars.length)); r.cycle = r.beats * r.bars;
  r.events = [];
  r.rows.forEach((row, ri) => { for (let bi = 0; bi < r.bars; bi++) { const steps = row.bars[bi % row.bars.length]; steps.forEach((v, si) => { if (v) r.events.push({ beat: bi * r.beats + si / steps.length * r.beats, sound: row.sound, vel: v, row: ri, bar: bi, step: si }); }); } });
  for (let b = 0; b < r.cycle; b++) r.events.push({ beat: b, sound: b % r.beats === 0 ? 'tock' : 'tick', vel: .8, click: true });
  return r;
}

/* ---- syllables: Kodály words for the hits in a beat; takadimi letters for the rest ---- */
const KODALY = { '1000': 'ta', '1010': 'ti ti', '1111': 'ti-ka ti-ka', '1011': 'ti ti-ka', '1110': 'ti-ka ti', '1001': 'tim ka', '1100': 'ti-ka ∙', '0010': '∙ ti', '0011': '∙ ti-ka', '0100': '∙ ka', '0110': '∙ ka di', '1101': 'ti-ka ∙ ka', '0000': '∙',
  '100': 'ta', '111': 'tri-o-la', '101': 'ta ki', '110': 'ti-ki ∙', '011': '∙ ki da', '001': '∙ ∙ da', '010': '∙ ki', '000': '∙', '10': 'ta', '11': 'ti ti', '01': '∙ ti', '00': '∙', '1': 'ta', '0': '∙' };
const SYL_NAMES = [[0, 'ta'], [.5, 'di'], [.25, 'ka'], [.75, 'mi'], [1 / 3, 'ki'], [2 / 3, 'da']];
// Carnatic konnakol: a beat split into n speaks the n-syllable group; a rest keeps its place in the group but is silent.
const KONNAKOL = { 1: ['ta'], 2: ['ta', 'ka'], 3: ['ta', 'ki', 'ta'], 4: ['ta', 'ka', 'di', 'mi'], 5: ['ta', 'di', 'gi', 'na', 'tom'], 6: ['ta', 'ki', 'ta', 'ta', 'ki', 'ta'], 7: ['ta', 'ka', 'di', 'mi', 'ta', 'ki', 'ta'], 8: ['ta', 'ka', 'di', 'mi', 'ta', 'ka', 'ju', 'nu'], 9: ['ta', 'ka', 'di', 'mi', 'ta', 'di', 'gi', 'na', 'tom'] };
// takadimi: the syllable names the position in the beat, whatever sounds around it
const TAKADIMI = { 1: ['ta'], 2: ['ta', 'di'], 3: ['ta', 'ki', 'da'], 4: ['ta', 'ka', 'di', 'mi'], 6: ['ta', 'va', 'ki', 'di', 'da', 'ma'], 8: ['ta', 'ka', 'di', 'mi', 'ta', 'ka', 'di', 'mi'] };
// fruit words for the hits in a beat, keyed like KODALY. The Prodigies words: beat (quarter), cher-ry (two eighths),
// pine-ap-ple (triplet), av-o-ca-do (four sixteenths), blue-ber-ry (eighth and two sixteenths); a hit held over two
// beats is mel-on and over four wa-ter-mel-on (see fruitLong). The rest are stand-ins, to be edited to the words you use.
const FRUIT = { '1000': 'beat', '1010': 'cher-ry', '1111': 'av-o-ca-do', '1011': 'blue-ber-ry', '1110': 'straw-ber-ry', '1001': 'ki-wi', '1101': 'can-ta-loupe', '0101': '∙ ki-wi', '0010': '∙ plum', '0100': '∙ fig', '0011': '∙ cher-ry', '0000': '∙',
  '100': 'beat', '111': 'pine-ap-ple', '101': 'man-go', '110': 'cher-ry ∙', '011': '∙ cher-ry', '000': '∙', '10': 'beat', '11': 'cher-ry', '01': '∙ fig', '00': '∙', '1': 'beat', '0': '∙' };
// a beat followed by silent beats in the same bar is one long note: two beats mel-on, four wa-ter-mel-on
function fruitLong(words, beatsPerBar) {
  for (let i = 0; i < words.length; i++) {
    if (words[i] !== 'beat') continue;
    let n = 0; while (i + n + 1 < words.length && (i + n + 1) % beatsPerBar !== 0 && words[i + n + 1] === '∙') n++;
    if (n >= 3) { ['wa', 'ter', 'mel', 'on'].forEach((w, k) => words[i + k] = w); i += 3; }
    else if (n >= 1) { words[i] = 'mel'; words[i + 1] = 'on'; i += n; }
  }
  return words;
}
// counting: the syllable names the position in the beat, and only onsets are spoken
const COUNTS = { 1: [''], 2: ['', '&'], 3: ['', 'la', 'li'], 4: ['', 'e', '&', 'a'], 6: ['', 'ta', 'la', 'ta', 'li', 'ta'], 8: ['', 'ta', 'e', 'ta', '&', 'ta', 'a', 'ta'] };
const SYSTEMS = { kodaly: 'Kodály', fruit: 'Fruit', counts: '1 e & a', takadimi: 'Takadimi', konnakol: 'Konnakol' };
function konnakolRow(steps) {   // one syllable per pulse of the bar: each run of hits is a group, runs past nine are said in fours
  const out = new Array(steps.length).fill('∙'); let i = 0;
  while (i < steps.length) { if (!steps[i]) { i++; continue; } let j = i; while (j < steps.length && steps[j]) j++; let n = j - i, k = i; while (n > 0) { const g = n <= 9 ? n : (n % 4 === 0 || n > 12 ? 4 : n - 4 <= 9 ? n - 4 : 4); KONNAKOL[g].forEach(sy => out[k++] = sy); n -= g; } i = j; }
  return out;
}
const sylFrac = fracs => fracs.map(f => { const k = SYL_NAMES.find(x => Math.abs(x[0] - f) < .02); return k ? k[1] : 'ka'; }).join(' ');
function syllables(hits, n, beat) {
  if (state.sylsys === 'counts') { const c = COUNTS[n]; return Array.from({ length: n }, (_, i) => !hits.includes(i) ? '' : i === 0 ? String(beat + 1) : c ? c[i] : sylFrac([i / n])).filter(Boolean).join(' ') || ' '; }
  const sys = state.sylsys === 'konnakol' ? KONNAKOL[n] : state.sylsys === 'takadimi' ? TAKADIMI[n] : null;
  if (sys) return Array.from({ length: n }, (_, i) => hits.includes(i) ? sys[i] : '∙').join(' ');
  const key = Array.from({ length: n }, (_, i) => hits.includes(i) ? '1' : '0').join('');
  if (state.sylsys === 'fruit' && FRUIT[key]) return FRUIT[key];
  if (KODALY[key]) return KODALY[key];
  return Array.from({ length: n }, (_, i) => hits.includes(i) ? sylFrac([i / n]) : '∙').join(' ');
}

/* ================= rhythm views ================= */
const RV = {};
// Grid: a box for every step, a column per bar, the playhead sweeping; the row's own step count shapes its boxes.
RV.grid = {
  build(el, r, opts = {}) {
    const W = 1000, labW = opts.body ? 120 : 90, rowH = opts.rowH || 60, barW = (W - labW - 10) / r.bars, top = 30;
    const H = top + r.rows.length * rowH + 20;
    let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
    // beat numbers
    for (let bi = 0; bi < r.bars; bi++) for (let b = 0; b < r.beats; b++) s += `<text x="${labW + bi * barW + (b + .5) * barW / r.beats}" y="20" text-anchor="middle" font-size="16" fill="#777">${b + 1}</text>`;
    r.rows.forEach((row, ri) => {
      const y = top + ri * rowH;
      const label = opts.body && BODY[row.sound] ? BODY[row.sound][2] : row.name;
      s += `<text x="${labW - 10}" y="${y + rowH / 2 + 6}" text-anchor="end" font-size="18" font-weight="600" fill="${row.colour}">${esc(label)}</text>`;
      for (let bi = 0; bi < r.bars; bi++) {
        const steps = row.bars[bi % row.bars.length], w = barW / steps.length;
        steps.forEach((v, si) => {
          const x = labW + bi * barW + si * w, beatStart = (si * r.beats) % steps.length === 0;
          s += `<rect class="cell" data-r="${ri}" data-b="${bi}" data-s="${si}" x="${x + 1}" y="${y + 4}" width="${w - 2}" height="${rowH - 8}" rx="4" fill="${v ? row.colour : '#f3f3f3'}" fill-opacity="${v ? (v > 1 ? 1 : v >= 1 ? .85 : .4) : 1}" stroke="${beatStart ? '#aaa' : '#e4e4e4'}" stroke-width="${beatStart ? 1.5 : 1}"/>`;
          if (v > 1) s += `<text x="${x + w / 2}" y="${y + rowH / 2 + 7}" text-anchor="middle" font-size="18" fill="#fff" pointer-events="none">&gt;</text>`;
        });
      }
    });
    for (let bi = 0; bi <= r.bars; bi++) s += `<line x1="${labW + bi * barW}" x2="${labW + bi * barW}" y1="${top - 4}" y2="${H - 16}" stroke="#555" stroke-width="2"/>`;
    s += `<line id="ph" x1="${labW}" x2="${labW}" y1="${top - 8}" y2="${H - 12}" stroke="${HI}" stroke-width="4" stroke-linecap="round"/></svg>`;
    el.innerHTML = s; this.el = el; this.r = r; this.labW = labW; this.barW = barW; this.ph = el.querySelector('#ph'); this.cells = [...el.querySelectorAll('.cell')]; this.lit = new Set();
  },
  paint(p) {
    const r = this.r, x = this.labW + p / r.beats * this.barW; this.ph.setAttribute('x1', x); this.ph.setAttribute('x2', x);
    const bi = Math.floor(p / r.beats), frac = p / r.beats - bi;
    for (const c of this.lit) c.setAttribute('stroke', c.dataset.k || '#e4e4e4'), c.setAttribute('stroke-width', 1); this.lit.clear();
    r.rows.forEach((row, ri) => { const n = row.bars[bi % row.bars.length].length, si = Math.floor(frac * n); const c = this.cells.find(c => +c.dataset.r === ri && +c.dataset.b === bi && +c.dataset.s === si); if (c) { if (!c.dataset.k) c.dataset.k = c.getAttribute('stroke'); c.setAttribute('stroke', HI); c.setAttribute('stroke-width', 4); this.lit.add(c); } });
  }
};
// Wheel: the whole cycle around a circle, one ring per drum with its own step count, hits joined into a necklace.
RV.wheel = {
  build(el, r) {
    const S = 600, cx = S / 2, cy = S / 2 + 10, R0 = 250, ringW = Math.min(40, 170 / Math.max(1, r.rows.length));
    let s = `<svg viewBox="0 0 ${S} ${S + 20}" preserveAspectRatio="xMidYMid meet">`;
    const total = r.cycle, ang = b => -Math.PI / 2 + 2 * Math.PI * b / total;
    for (let b = 0; b < total; b++) { const a = ang(b), bar = b % r.beats === 0; s += `<line x1="${cx + Math.cos(a) * (R0 + 6)}" y1="${cy + Math.sin(a) * (R0 + 6)}" x2="${cx + Math.cos(a) * (R0 + (bar ? 22 : 14))}" y2="${cy + Math.sin(a) * (R0 + (bar ? 22 : 14))}" stroke="${bar ? '#333' : '#999'}" stroke-width="${bar ? 3 : 2}"/><text x="${cx + Math.cos(a) * (R0 + 36)}" y="${cy + Math.sin(a) * (R0 + 36) + 6}" text-anchor="middle" font-size="16" fill="#777">${b % r.beats + 1}</text>`; }
    r.rows.forEach((row, ri) => {
      const R = R0 - 10 - ri * ringW - ringW / 2; s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#e6e6e6" stroke-width="1"/>`;
      const pts = [];
      for (let bi = 0; bi < r.bars; bi++) { const steps = row.bars[bi % row.bars.length]; steps.forEach((v, si) => { const a = ang(bi * r.beats + si / steps.length * r.beats), x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R; if (v) pts.push([x, y]); s += v ? `<circle class="hit" data-r="${ri}" data-beat="${bi * r.beats + si / steps.length * r.beats}" cx="${x}" cy="${y}" r="${ringW * (v > 1 ? .42 : v >= 1 ? .34 : .22)}" fill="${row.colour}"/>` : `<circle cx="${x}" cy="${y}" r="2.5" fill="#bbb"/>`; }); }
      if (pts.length > 1) s = s.replace(`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#e6e6e6" stroke-width="1"/>`, `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#e6e6e6" stroke-width="1"/><polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${row.colour}" fill-opacity=".08" stroke="${row.colour}" stroke-opacity=".5" stroke-width="1.5"/>`);
      s += `<text x="${cx}" y="${cy - R + ringW / 2 - 2}" text-anchor="middle" font-size="${Math.min(14, ringW * .5)}" fill="${row.colour}" font-weight="600">${esc(row.name)}</text>`;
    });
    s += `<line id="hand" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R0 - 4}" stroke="${HI}" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="8" fill="#333"/></svg>`;
    el.innerHTML = s; this.r = r; this.hand = el.querySelector('#hand'); this.cx = cx; this.cy = cy; this.hits = [...el.querySelectorAll('.hit')];
  },
  paint(p) {
    this.hand.setAttribute('transform', `rotate(${360 * p / this.r.cycle} ${this.cx} ${this.cy})`);
    for (const h of this.hits) { const d = p - +h.dataset.beat, on = d >= 0 && d < .3; h.setAttribute('stroke', on ? HI : 'none'); h.setAttribute('stroke-width', on ? 5 : 0); }
  }
};
// Syllables: Kodály stick notation beat by beat with the words under it, one line per drum.
RV.syll = {
  build(el, r) {
    const W = 1000, labW = 90, rowH = 110, beatW = (W - labW - 10) / r.cycle, top = 20, H = top + r.rows.length * rowH + 10;
    let s = `<svg viewBox="0 0 ${W} ${H + 30}" preserveAspectRatio="xMidYMid meet">`;
    this.beats = [];
    r.rows.forEach((row, ri) => {
      const y = top + ri * rowH;
      s += `<text x="${labW - 10}" y="${y + 50}" text-anchor="end" font-size="18" font-weight="600" fill="${row.colour}">${esc(row.name)}</text>`;
      for (let bi = 0; bi < r.bars; bi++) {
        const steps = row.bars[bi % row.bars.length], n = steps.length / r.beats;
        const beatWords = [];
        for (let b = 0; b < r.beats; b++) { const hits = [], lo = b * n, hi = (b + 1) * n; steps.forEach((v, si) => { if (v && si >= lo - 1e-9 && si < hi - 1e-9) hits.push(si - lo); }); const idx = hits.map(h => Number.isInteger(n) ? h : h / n); beatWords.push(state.sylsys === 'konnakol' && Number.isInteger(n) ? konnakolRow(steps).slice(lo, hi).join(' ') : Number.isInteger(n) ? syllables(hits, n, b) : sylFrac(idx)); }
        if (state.sylsys === 'fruit') fruitLong(beatWords, r.beats);
        for (let b = 0; b < r.beats; b++) {
          const x0 = labW + (bi * r.beats + b) * beatW, hits = [];
          const lo = b * n, hi = (b + 1) * n; steps.forEach((v, si) => { if (v && si >= lo - 1e-9 && si < hi - 1e-9) hits.push(si - lo); });
          const idx = hits.map(h => Number.isInteger(n) ? h : h / n);
          const word = beatWords[b];
          s += `<rect class="beat" data-r="${ri}" data-beat="${bi * r.beats + b}" x="${x0 + 2}" y="${y}" width="${beatW - 4}" height="${rowH - 10}" rx="6" fill="#fafafa" stroke="#e4e4e4"/>`;
          // stick notation: a stem per hit, beams between hits inside the beat
          const stemX = f => x0 + 14 + f * (beatW - 28), base = y + 58, topY = y + 14;
          const fr = idx.map(h => Number.isInteger(n) ? h / n : h);
          if (!fr.length) s += `<path d="M${x0 + beatW / 2 - 8},${topY + 6} l12,12 l-12,12 l14,12" fill="none" stroke="${row.colour}" stroke-width="3" stroke-linecap="round"/>`;
          fr.forEach((f, k) => {
            s += `<line x1="${stemX(f)}" x2="${stemX(f)}" y1="${topY}" y2="${base}" stroke="${row.colour}" stroke-width="4" stroke-linecap="round"/>`;
            if (k < fr.length - 1) { const g = fr[k + 1] - f, beams = g <= .26 ? 2 : 1; for (let m = 0; m < beams; m++) s += `<line x1="${stemX(f)}" x2="${stemX(fr[k + 1])}" y1="${topY + m * 9}" y2="${topY + m * 9}" stroke="${row.colour}" stroke-width="5"/>`; }
          });
          if (fr.length && fr[0] > 0.01) s += `<text x="${stemX(0)}" y="${topY + 20}" font-size="20" fill="#aaa" text-anchor="middle">𝄾</text>`;
          if (n === 3 && fr.length > 1) s += `<text x="${x0 + beatW / 2}" y="${topY - 4}" font-size="12" fill="#777" text-anchor="middle">3</text>`;
          // each syllable sits under its onset: a word splits at spaces and hyphens, rests (∙) take no syllable
          const syls = word.split(/[\s-]+/).filter(t => t && t !== '∙');
          if (syls.length && syls.length === fr.length) { const fs = Math.min(20, (beatW - 20) / Math.max(1, fr.length) / Math.max(2.2, Math.max(...syls.map(t => t.length)) * .62)); syls.forEach((t, k) => s += `<text x="${stemX(fr[k])}" y="${y + 86}" text-anchor="middle" font-size="${fs}" fill="#333">${esc(t)}</text>`); }
          else s += `<text x="${x0 + beatW / 2}" y="${y + 88}" text-anchor="middle" font-size="${Math.min(22, beatW / Math.max(4, word.length) * 1.9)}" fill="${word === '∙' ? '#bbb' : '#333'}">${esc(word)}</text>`;
          if (ri === 0) s += `<text x="${x0 + beatW / 2}" y="${y - 4}" text-anchor="middle" font-size="14" fill="#777">${b + 1}</text>`;
        }
      }
    });
    Object.entries(SYSTEMS).forEach(([k, v], i) => { const on = state.sylsys === k, x = W - 10 - (Object.keys(SYSTEMS).length - 1 - i) * 92; s += `<g class="sylsys" data-sys="${k}" style="cursor:pointer"><rect x="${x - 86}" y="${H - 6}" width="84" height="24" rx="12" fill="${on ? '#222' : '#fff'}" stroke="${on ? '#222' : '#bbb'}"/><text x="${x - 44}" y="${H + 11}" text-anchor="middle" font-size="12.5" fill="${on ? '#fff' : '#333'}">${v}</text></g>`; });
    s += `</svg>`;
    el.innerHTML = s;
    el.querySelectorAll('.sylsys').forEach(g => g.onclick = () => { state.sylsys = g.dataset.sys; state.rebuild(); });
    this.r = r; this.cells = [...el.querySelectorAll('.beat')];
  },
  paint(p) { const b = Math.floor(p); for (const c of this.cells) { const on = +c.dataset.beat === b; c.setAttribute('fill', on ? '#fff1c7' : '#fafafa'); c.setAttribute('stroke', on ? HI : '#e4e4e4'); c.setAttribute('stroke-width', on ? 3 : 1); } }
};

/* ================= dance text ================= */
/* ---- poses: a whole-body shape, written the way DanceWriting draws one ----
   pose NAME: part=value ...   defines a shape; the poses: line calls it on a count (. holds, 0 lets it go).

    setupEl.querySelector('.sclose').addEventListener('click', closeSetup);
    const pickSetup = d => {
      const c = cells[cells.indexOf(setupCell) + d]; if (!c) return;
      if (document.body.classList.contains('impress-on-overview')) { setupCell = c; syncSetup(); }
      else impress().goto('cell-' + c.id);           // the stepenter that follows selects it
    };
    setupEl.querySelector('.sprev').addEventListener('click', () => pickSetup(-1));
    setupEl.querySelector('.snext').addEventListener('click', () => pickSetup(1));
    setupEl.querySelector('.sauto').addEventListener('click', () => { delete setupCell.pos; delete setupCell.bg; save(); syncSetup(); refit(); });
    setupEl.querySelector('.sfly').addEventListener('click', () => {
      const target = setupCell, i = cells.indexOf(target);     // the jump to the cell before selects that one for a moment
      impress().goto(i ? 'cell-' + cells[i - 1].id : 'overview', 0);
      void impressRoot.offsetWidth;                              // settle the jump, so the flight animates from there
      setTimeout(() => impress().goto('cell-' + target.id), 30);
    });
    bgIn.addEventListener('input', () => {
      setupCell.bg = bgIn.value; save(); placeSteps(false);
      const active = impressRoot.querySelector('.step.active');
      if (active && active.id === 'cell-' + setupCell.id) document.body.style.setProperty('--stage-bg', setupCell.bg);
    });
    setupEl.querySelector('.sbgauto').addEventListener('click', e => {
      e.preventDefault(); delete setupCell.bg; save(); placeSteps(false); syncSetup();
      const active = impressRoot.querySelector('.step.active');
      if (active && active.id === 'cell-' + setupCell.id) document.body.style.setProperty('--stage-bg', 'var(--bg)');
    });
    // Keys and touches in the panel stay there: impress.js reads arrows, space
    // and swipes from the whole document as navigation.
    setupEl.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') { e.preventDefault(); closeSetup(); } });
    for (const t of ['keyup', 'keypress', 'touchstart', 'touchmove', 'touchend', 'click', 'wheel']) setupEl.addEventListener(t, e => e.stopPropagation());
    // On the overview, a click on a cell chooses it for the panel instead of flying there.
    impressRoot.addEventListener('click', e => {
      if (!setupOpen() || !document.body.classList.contains('impress-on-overview')) return;
      const step = e.target.closest('.step'); const cell = step && cells.find(c => 'cell-' + c.id === step.id);
      if (!cell) return;
      e.stopPropagation(); e.preventDefault();
      setupCell = cell; syncSetup();
    }, true);
    function navKey(e) {
      const classic = document.body.classList.contains('present');
      if (!classic && !in3d) return;
      if (e.key === 'Escape') { e.preventDefault(); in3d ? exit3d() : exitPresent(); }
      else if (e.key === 'PageDown') { e.preventDefault(); in3d ? impress().next() : (current < cells.length - 1 && (current++, showCurrent())); }
      else if (e.key === 'PageUp') { e.preventDefault(); in3d ? impress().prev() : (current > 0 && (current--, showCurrent())); }
    }
    document.getElementById('present3d').addEventListener('click', present3d);
    document.getElementById('navPrev').addEventListener('click', () => { if (in3d) return impress().prev(); if (current > 0) { current--; showCurrent(); } });
    document.getElementById('navNext').addEventListener('click', () => { if (in3d) return impress().next(); if (current < cells.length - 1) { current++; showCurrent(); } });
    document.getElementById('navExit').addEventListener('click', () => in3d ? exit3d() : exitPresent());
    document.addEventListener('keydown', e => {
      if (e.target.matches('textarea, input, select')) return;     // handled at the field
      if (e.key === 'Escape' && menu.open) { menu.open = false; return; }
      if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && (e.key === 'z' || e.key === 'Z') && trash.length) { e.preventDefault(); undoDelete(); return; }
      // Presenting, the space bar plays and pauses the cell on screen.
      if (e.key === ' ' && document.body.classList.contains('present') && current >= 0 && !e.metaKey && !e.ctrlKey && !e.altKey) { const en = engines.get(cells[current].id); if (en && en.togglePlay) { e.preventDefault(); en.togglePlay(); return; } }
      navKey(e);
    });
    // impress.js's help (H, ?) and speaker-console (P) plugins keep permanent
    // key handlers; neither belongs in this page, so those keys are swallowed
    // before any document or window listener sees them.
    for (const type of ['keydown', 'keyup']) window.addEventListener(type, e => {
      if (e.target && e.target.matches && e.target.matches('textarea, input, select')) return;
      if (['p', 'P', 'h', 'H', '?'].includes(e.key)) e.stopImmediatePropagation();
    }, true);

    /* ---------- toolbar ---------- */
    const menu = document.getElementById('menu');
    document.addEventListener('click', e => { if (menu.open && !menu.contains(e.target)) menu.open = false; });
    for (const id of ['share', 'export', 'import', 'clear']) document.getElementById(id).addEventListener('click', () => { menu.open = false; });
    document.getElementById('addText').addEventListener('click', () => addCell('text'));
    const propBox = document.getElementById('proportional');
    propBox.checked = proportional;
    propBox.addEventListener('change', () => {
      proportional = propBox.checked; localStorage.setItem('gcs-proportional', proportional ? 'on' : 'off');
      for (const en of engines.values()) if (en.render) en.render();
    });
    // Theme: follows the system until the button is used; the choice is remembered.
    const themeBtn = document.getElementById('theme');
    const isDark = () => document.documentElement.dataset.theme === 'dark' ||
      (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    const paintTheme = () => { themeBtn.textContent = isDark() ? '☀' : '☾'; };
    const savedTheme = localStorage.getItem('gcs-theme');
    if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
    paintTheme();
    const rerenderNotation = () => { for (const en of engines.values()) if (en.render) en.render(); };
    themeBtn.addEventListener('click', () => {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.dataset.theme = next; localStorage.setItem('gcs-theme', next); paintTheme();
      rerenderNotation();                     // letter colours on light noteheads depend on the theme
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paintTheme(); rerenderNotation(); });
    document.getElementById('addAbc').addEventListener('click', () => addCell('abc'));
    document.getElementById('addRhythm').addEventListener('click', () => addCell('rhythm'));
    document.getElementById('addDance').addEventListener('click', () => addCell('dance'));
    /* ---------- the document format ----------
       Plain text. An optional first line `=== page {json}` carries the page
       settings (proportional spacing; older files also a text font, which
       goes to their text cells); then one block per cell: `=== type {json}`
       (type: text, abc, rhythm or dance; an older `heading` reads as a centred
       text cell; the json, when present, holds the 3D layout dx dy dz r rx ry s
       (older files: x y z in pixels, rewritten on reading),
       background bg, a text cell's font and align, transposition tr and the
       instrument view inst)
       followed by the cell's text, verbatim, until the next separator. A file
       with no separators becomes one text cell. */
    const SEP = /^=== (page|text|abc|heading|rhythm|dance)\s*(\{.*\})?\s*$/;
    function serialize() {
      const meta = c => { const m = { ...(c.pos || {}) }; if (c.font) m.font = c.font; if (c.align) m.align = c.align; if (c.bg) m.bg = c.bg; if (c.tr) m.tr = c.tr; if (c.inst) m.inst = c.inst; if (c.nota) m.nota = c.nota; if (c.names) m.names = c.names; if (c.play) m.play = c.play; if (c.harm) m.harm = c.harm; if (c.style) m.style = c.style; if (c.mv) m.mv = c.mv; if (c.fac) m.fac = c.fac; if (c.band) m.band = c.band; return Object.keys(m).length ? ' ' + JSON.stringify(m) : ''; };
      const page = JSON.stringify({ proportional });
      return `=== page ${page}\n` + cells.map(c => `=== ${c.type}${meta(c)}\n${c.text}`).join('\n') + '\n';
    }
    function parse(text) {
      const lines = text.split('\n'); const out = []; let cur = null, page = null;
      for (const line of lines) {
        const m = line.match(SEP);
        if (m && m[1] === 'page') { cur = null; try { page = JSON.parse(m[2] || '{}'); } catch (err) {} }
        else if (m) {
          cur = { id: ++seq, type: m[1], text: '' };
          if (m[2]) { try { const j = JSON.parse(m[2]); if (j.font in FONTS) cur.font = j.font; if (j.align === 'center') cur.align = j.align; delete j.font; delete j.align; if (j.bg) cur.bg = j.bg; if (j.tr) cur.tr = j.tr; if (j.inst) cur.inst = j.inst; if (j.nota) cur.nota = j.nota; if (j.names) cur.names = j.names; if (j.play) cur.play = j.play; if (j.harm) cur.harm = j.harm; if (j.style) cur.style = j.style; if (j.mv) cur.mv = j.mv; if (j.fac) cur.fac = j.fac; if (j.band) cur.band = j.band; delete j.bg; delete j.tr; delete j.inst; delete j.nota; delete j.names; delete j.play; delete j.harm; delete j.style; delete j.band; delete j.mv; delete j.fac; if (Object.keys(j).length) cur.pos = j; } catch (err) {} }
          out.push(cur);
        }
        else if (cur) cur.text += (cur.text ? '\n' : '') + line;
      }
      if (!out.length) out.push({ id: ++seq, type: 'text', text: lines.join('\n') });
      for (const c of out) { c.text = c.text.replace(/\n$/, ''); upgradeCell(c, page && page.font); }
      upgradeLayout(out);
      return { cells: out, page };
    }
    function loadDocument(doc) {
      if (doc.page) {
        if (typeof doc.page.proportional === 'boolean' && doc.page.proportional !== proportional) { proportional = doc.page.proportional; propBox.checked = proportional; localStorage.setItem('gcs-proportional', proportional ? 'on' : 'off'); }
      }
      cells = doc.cells; trash.length = 0; rebuild(); save();
    }
    document.getElementById('export').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([serialize()], { type: 'text/plain' }));
      a.download = 'grand-central-stationery.gcs.txt'; a.click(); URL.revokeObjectURL(a.href);
    });
    document.getElementById('import').addEventListener('click', () => document.getElementById('file').click());
    document.getElementById('file').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      loadDocument(parse(await f.text())); e.target.value = '';
    });
    /* ---------- share link ----------
       The whole document rides in the URL fragment: deflate (the browser's
       CompressionStream, where present) then base64url. The fragment is
       never sent to a server, so the link works for pages opened from disk
       or from any copy of this folder. */
    const b64u = { enc: bytes => { let b = ''; for (let i = 0; i < bytes.length; i += 0x8000) b += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
                   dec: str => Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)) };
    const pipe = async (bytes, Stream, kind) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new Stream(kind))).arrayBuffer());
    async function shareLink() {
      const bytes = new TextEncoder().encode(serialize());
      let tag = 't', payload = bytes;
      if (typeof CompressionStream === 'function') { try { payload = await pipe(bytes, CompressionStream, 'deflate-raw'); tag = 'z'; } catch (err) {} }
      return { url: location.href.split('#')[0] + '#gcs=' + tag + b64u.enc(payload), raw: bytes.length, packed: payload.length };
    }
    async function readShared(hash) {
      const m = hash.match(/^#gcs=([zt])([A-Za-z0-9_-]+)$/); if (!m) return null;
      let bytes = b64u.dec(m[2]);
      if (m[1] === 'z') bytes = await pipe(bytes, DecompressionStream, 'deflate-raw');
      return parse(new TextDecoder().decode(bytes));
    }
    document.getElementById('share').addEventListener('click', async () => {
      const { url, raw, packed } = await shareLink();
      const kb = n => (n / 1024).toFixed(1) + ' KB';
      try { await navigator.clipboard.writeText(url); toast(`Link copied: ${kb(url.length)} for ${kb(raw)} of text`); }
      catch (err) { prompt('Copy this link:', url); }
    });
    (async () => {
      let doc = null;
      try { doc = await readShared(location.hash); } catch (err) { console.warn('shared link not readable', err); }
      if (!doc) return;
      history.replaceState(null, '', location.pathname + location.search);
      const own = cells.map(c => c.text).join('\n').trim();
      const sample = SAMPLE.map(c => c.text).join('\n').trim();
      if (own && own !== sample && own !== doc.cells.map(c => c.text).join('\n').trim() && !confirm('Open the lesson from this link? It replaces the cells on this page (Export first to keep them).')) return;
      loadDocument(doc);
    })();
    document.getElementById('clear').addEventListener('click', () => { if (confirm('Remove all cells?')) { cells = [{ id: ++seq, type: 'text', text: '' }]; rebuild(); save(); } });

    /* ---------- go ---------- */
    rebuild();
    // Google Fonts splits Noto Music into unicode-range subsets; name the
    // accidentals so the music subset loads, then re-render everything.
    const rerenderAll = () => { primeCanvas(); for (const en of engines.values()) (en.remeasure ? en.remeasure() : en.render()); };
    if (document.fonts) {
      document.fonts.ready.then(rerenderAll).catch(() => {});
      document.fonts.load("400 100px 'Noto Music'", '\u266F\u266D\u266E').then(rerenderAll).catch(() => {});
    }
    window.GCS = { lab: { sampler, DRUM, STYLES, COMP_FOLDER, SYNTH_VOICES, SYNTH_KITS, SAMPLE_STEP, SAMPLE_SETS, SAMPLE_NOTES, setOf, sampleOf, melodyOctave, SOUND, TONE },   // lab: what test/band-lab.js measures with
      cells: () => cells, engines, addCell, present, exitPresent, present3d, exit3d, rebuild, FONTS, serialize, parse, loadDocument, shareLink, readShared, undoDelete, reorder };
  })();
  </script>
</body>
</html>
