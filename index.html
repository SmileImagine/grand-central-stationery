      el.querySelector('.game').addEventListener('click', () => { gameMode = true; document.body.classList.add('game'); present(cells.indexOf(cell)); for (const en of engines.values()) if (en.oneLine) en.render(); });
      el.querySelector('.del').addEventListener('click', () => {
        const index = cells.indexOf(cell);
        cells.splice(index, 1);
        const en = engines.get(cell.id); if (en) en.destroy(); engines.delete(cell.id);
        el.remove();
        trash.push({ cell, index });
        if (!cells.length) { cells.push({ id: ++seq, type: 'text', text: '' }); cellsEl.appendChild(buildCell(cells[0])); }
        renumber(); save();
        toast(`${cell.type === 'abc' ? 'Notation' : cell.type === 'rhythm' ? 'Rhythm' : cell.type === 'dance' ? 'Dance' : cell.type === 'heading' ? 'Heading' : 'Text'} cell deleted`, 'Undo', undoDelete);
      });
      el.querySelector('.show').addEventListener('click', () => present(cells.indexOf(cell)));
      const posEl = el.querySelector('.pos');
      el.querySelector('.xyz').addEventListener('click', () => posEl.classList.toggle('open'));
      for (const inp of posEl.querySelectorAll('input')) {
        const k = inp.dataset.k;
        if (k === 'bg') { if (cell.bg) inp.value = cell.bg; }
        else if (cell.pos && cell.pos[k] !== undefined) inp.value = cell.pos[k];
        inp.addEventListener('input', () => {
          if (k === 'bg') cell.bg = inp.value;
          else { cell.pos = cell.pos || {}; if (inp.value === '') delete cell.pos[k]; else cell.pos[k] = parseFloat(inp.value); }
          save();
        });
      }
      el.querySelector('.posclear').addEventListener('click', () => { delete cell.pos; delete cell.bg; for (const inp of posEl.querySelectorAll('input')) inp.value = inp.type === 'color' ? '#ffffff' : ''; save(); });
      body.addEventListener('focusin', () => { for (const c of cellsEl.querySelectorAll('.cell.focused')) c.classList.remove('focused'); el.classList.add('focused'); });
      // Keys typed in a cell never leave the field: impress.js plugins listen on
      // the document and window (navigation, help on H, speaker console on P),
      // and some of those listeners outlive its teardown.
      for (const ta of body.querySelectorAll('textarea')) {
        const h = attachHistory(cell, ta);
        ta.addEventListener('keydown', e => {
          const mod = (e.metaKey || e.ctrlKey) && !e.altKey;
          if (e.key === 'Enter' && mod) { e.preventDefault(); addCell(e.shiftKey ? 'abc' : 'text', cells.indexOf(cell) + 1); }
          else if (mod && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); e.shiftKey ? h.redo_() : h.undo_(); }
          else if (mod && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); h.redo_(); }
          else navKey(e);
          e.stopPropagation();
        });
        ta.addEventListener('keyup', e => e.stopPropagation());
      }
      return el;
    }
    function rebuild() {
      for (const en of engines.values()) en.destroy();
      engines.clear();
      cellsEl.innerHTML = '';
      for (const c of cells) buildCell(c);
    }
    function addCell(type, at = cells.length) {
      const cell = { id: ++seq, type, text: type === 'rhythm' ? MoveCell.START.rhythm : type === 'dance' ? MoveCell.START.dance : '' };
      if (type === 'abc') { try { const last = localStorage.getItem('gcs-last-inst'); if (last && last !== 'off' && INSTRUMENTS[last]) cell.inst = last; if (localStorage.getItem('gcs-last-nota') === 'tab') cell.nota = 'tab'; } catch (e) {} }   // the instrument chosen last time, so a new tune starts with it
      cells.splice(at, 0, cell);
      const el = buildCell(cell);
      cellsEl.insertBefore(el, cellsEl.children[at] || null);
      renumber(); save();
      const en = engines.get(cell.id); if (en) en.focus();
      cellsEl.querySelector(`.cell[data-id="${cell.id}"]`).scrollIntoView({ block: 'nearest' });
    }

    /* ---------- present mode ---------- */
    let current = -1;
    function present(i) {
      current = Math.max(0, Math.min(cells.length - 1, i));
      document.body.classList.add('present');
      for (const en of engines.values()) if (en.showDrawer) en.showDrawer(null);   // the bar alone; a tab opens a drawer
      showCurrent();
    }
    const navPos = document.getElementById('navPos'), navCount = document.getElementById('navCount');
    function setNav(i) { navPos.value = i >= 0 ? i + 1 : ''; navPos.max = cells.length; navCount.textContent = `/ ${cells.length}`; }
    const goNav = () => {
      const n = parseInt(navPos.value, 10); if (!(n >= 1 && n <= cells.length)) return;
      if (in3d) impress().goto('cell-' + cells[n - 1].id); else { current = n - 1; showCurrent(); }
      navPos.blur();
    };
    navPos.addEventListener('change', goNav);
    navPos.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); goNav(); } if (e.key === 'Escape') { e.preventDefault(); in3d ? exit3d() : exitPresent(); } });
    function showCurrent() {
      cellsEl.querySelectorAll('.cell').forEach((el, i) => el.classList.toggle('current', i === current));
      setNav(current);
      const en = engines.get(cells[current].id);
      if (en) requestAnimationFrame(() => en.focus());
    }
    function exitPresent() {
      document.body.classList.remove('present');
      if (gameMode) { gameMode = false; document.body.classList.remove('game'); for (const en of engines.values()) if (en.oneLine) en.render(); }
      for (const en of engines.values()) if (en.showDrawer) en.showDrawer('melody');   // back to editing: the text in view
      cellsEl.querySelectorAll('.cell.current').forEach(el => el.classList.remove('current'));
      current = -1;
    }
    document.getElementById('present').addEventListener('click', () => present(Math.max(0, cells.findIndex(c => cellsEl.querySelector(`.cell[data-id="${c.id}"]`).classList.contains('focused')))));
    /* ---------- 3D present mode ---------- */
    const impressRoot = document.getElementById('impress');
    let in3d = false;
    // Automatic layout: a gentle zigzag row, four cells per row, slightly rotated.
    function autoPos(i) {
      const W = innerWidth, H = innerHeight;
      return { x: (i % 4) * W * 1.35, y: Math.floor(i / 4) * H * 1.45 + (i % 2 ? H * 0.12 : 0), z: 0, r: ((i % 3) - 1) * 4, rx: 0, ry: 0, s: 1 };
    }
    function cellPos(cell, i) { return { ...autoPos(i), ...(cell.pos || {}) }; }
    function present3d() {
      if (in3d) return;
      const W = innerWidth, H = innerHeight;
      impressRoot.setAttribute('data-width', W); impressRoot.setAttribute('data-height', H);
      impressRoot.innerHTML = '';
      // Overview first: the camera starts pulled back to show every cell.
      const ov = document.createElement('div'); ov.className = 'step overview'; ov.id = 'overview';
      const ps = cells.map(cellPos);
      const minX = Math.min(...ps.map(p => p.x)) - W / 2, maxX = Math.max(...ps.map(p => p.x)) + W / 2;
      const minY = Math.min(...ps.map(p => p.y)) - H / 2, maxY = Math.max(...ps.map(p => p.y)) + H / 2;
      ov.dataset.x = (minX + maxX) / 2; ov.dataset.y = (minY + maxY) / 2; ov.dataset.z = 0;
      ov.dataset.scale = Math.max((maxX - minX) / W, (maxY - minY) / H) * 1.08;
      impressRoot.appendChild(ov);
      cells.forEach((cell, i) => {
        const el = cellsEl.querySelector(`.cell[data-id="${cell.id}"]`);
        const p = ps[i];
        el.classList.add('step'); el.id = 'cell-' + cell.id;
        el.dataset.x = p.x; el.dataset.y = p.y; el.dataset.z = p.z; el.dataset.scale = p.s;
        el.dataset.rotateZ = p.r; el.dataset.rotateX = p.rx; el.dataset.rotateY = p.ry;   // roll, pitch, yaw
        el.style.setProperty('--cell-bg', cell.bg || 'var(--bg)');
        impressRoot.appendChild(el);
      });
      in3d = true;
      document.body.classList.add('present3d');
      impressRoot.addEventListener('impress:stepenter', onStepEnter);
      // impress.js writes the active step into the URL hash and restores it on
      // init; every session should start on the overview instead.
      history.replaceState(null, '', location.pathname + location.search);
      impress().init();
    }
    function onStepEnter(e) {
      const step = e.target;
      const cell = cells.find(c => 'cell-' + c.id === step.id);
      document.body.style.setProperty('--stage-bg', cell && cell.bg ? cell.bg : 'var(--bg)');
      const i = cell ? cells.indexOf(cell) : -1;
      setNav(i);
      if (cell) { const en = engines.get(cell.id); if (en) setTimeout(() => en.focus(), 50); }
    }
    function exit3d() {
      if (!in3d) return;
      impressRoot.removeEventListener('impress:stepenter', onStepEnter);
      // impress.js's teardown rebuilds its root through innerHTML, which would
      // clone every cell (losing textarea values and orphaning the engines).
      // So: make the overview the active step, move the original cells out
      // first, and let impress tear down a root that holds only the overview.
      impress().goto('overview', 0);
      for (const cell of cells) {
        const el = document.getElementById('cell-' + cell.id);
        if (!el) continue;
        el.classList.remove('step', 'active', 'past', 'future', 'present');
        el.removeAttribute('id'); el.removeAttribute('style');
        for (const k of ['x', 'y', 'z', 'rotateZ', 'rotateX', 'rotateY', 'scale']) delete el.dataset[k];
        cellsEl.appendChild(el);
      }
      impress().tear();
      impressRoot.innerHTML = '';
      history.replaceState(null, '', location.pathname + location.search);
      document.body.classList.remove('present3d', 'impress-enabled', 'impress-supported');
      document.body.style.removeProperty('--stage-bg');
      in3d = false;
    }
    document.getElementById('nav3dReset').addEventListener('click', () => {
      const kept = cells.map(c => ({ c, pos: c.pos, bg: c.bg }));
      if (!kept.some(k => k.pos || k.bg)) { toast('Every cell already uses the automatic layout', null, null, 3000); return; }
      const relayout = () => { exit3d(); rebuild(); present3d(); };
      for (const c of cells) { delete c.pos; delete c.bg; }
      save(); relayout();
      toast('3D layout reset', 'Undo', () => { for (const k of kept) { if (k.pos) k.c.pos = k.pos; if (k.bg) k.c.bg = k.bg; } save(); relayout(); }, 4000);
    });
    function navKey(e) {
      const classic = document.body.classList.contains('present');
      if (!classic && !in3d) return;
      if (e.key === 'Escape') { e.preventDefault(); in3d ? exit3d() : exitPresent(); }
      else if (e.key === 'PageDown') { e.preventDefault(); in3d ? impress().next() : (current < cells.length - 1 && (current++, showCurrent())); }
      else if (e.key === 'PageUp') { e.preventDefault(); in3d ? impress().prev() : (current > 0 && (current--, showCurrent())); }
    }
    document.getElementById('present3d').addEventListener('click', present3d);
    document.getElementById('navPrev').addEventListener('click', () => { if (in3d) return impress().prev(); if (current > 0) { current--; showCurrent(); } });
    document.getElementById('navNext').addEventListener('click', () => { if (in3d) return impress().next(); if (current < cells.length - 1) { current++; showCurrent(); } });
    document.getElementById('navExit').addEventListener('click', () => in3d ? exit3d() : exitPresent());
    document.addEventListener('keydown', e => {
      if (e.target.matches('textarea, input, select')) return;     // handled at the field
      if (e.key === 'Escape' && menu.open) { menu.open = false; return; }
      if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && (e.key === 'z' || e.key === 'Z') && trash.length) { e.preventDefault(); undoDelete(); return; }
      // Presenting, the space bar plays and pauses the cell on screen.
      if (e.key === ' ' && document.body.classList.contains('present') && current >= 0 && !e.metaKey && !e.ctrlKey && !e.altKey) { const en = engines.get(cells[current].id); if (en && en.togglePlay) { e.preventDefault(); en.togglePlay(); return; } }
      navKey(e);
    });
    // impress.js's help (H, ?) and speaker-console (P) plugins keep permanent
    // key handlers; neither belongs in this page, so those keys are swallowed
    // before any document or window listener sees them.
    for (const type of ['keydown', 'keyup']) window.addEventListener(type, e => {
      if (e.target && e.target.matches && e.target.matches('textarea, input, select')) return;
      if (['p', 'P', 'h', 'H', '?'].includes(e.key)) e.stopImmediatePropagation();
    }, true);

    /* ---------- toolbar ---------- */
    const menu = document.getElementById('menu');
    document.addEventListener('click', e => { if (menu.open && !menu.contains(e.target)) menu.open = false; });
    for (const id of ['share', 'export', 'import', 'clear']) document.getElementById(id).addEventListener('click', () => { menu.open = false; });
    document.getElementById('addText').addEventListener('click', () => addCell('text'));
    document.getElementById('addHeading').addEventListener('click', () => addCell('heading'));
    const propBox = document.getElementById('proportional');
    propBox.checked = proportional;
    propBox.addEventListener('change', () => {
      proportional = propBox.checked; localStorage.setItem('gcs-proportional', proportional ? 'on' : 'off');
      for (const en of engines.values()) if (en.render) en.render();
    });
    // Theme: follows the system until the button is used; the choice is remembered.
    const themeBtn = document.getElementById('theme');
    const isDark = () => document.documentElement.dataset.theme === 'dark' ||
      (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    const paintTheme = () => { themeBtn.textContent = isDark() ? '☀' : '☾'; };
    const savedTheme = localStorage.getItem('gcs-theme');
    if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
    paintTheme();
    const rerenderNotation = () => { for (const en of engines.values()) if (en.render) en.render(); };
    themeBtn.addEventListener('click', () => {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.dataset.theme = next; localStorage.setItem('gcs-theme', next); paintTheme();
      rerenderNotation();                     // letter colours on light noteheads depend on the theme
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paintTheme(); rerenderNotation(); });
    document.getElementById('addAbc').addEventListener('click', () => addCell('abc'));
    document.getElementById('addRhythm').addEventListener('click', () => addCell('rhythm'));
    document.getElementById('addDance').addEventListener('click', () => addCell('dance'));
    const picker = document.getElementById('fontpick');
    for (const [key, f] of Object.entries(FONTS)) picker.add(new Option(f.label, key));
    picker.value = fontKey;
    picker.addEventListener('change', () => applyFont(picker.value));
    /* ---------- the document format ----------
       Plain text. An optional first line `=== page {json}` carries the page
       settings (text font, proportional spacing); then one block per cell:
       `=== type {json}` (type: heading, text or abc; the json, when present,
       holds 3D position x y z r rx ry s, background bg, transposition tr and
       the instrument view inst)
       followed by the cell's text, verbatim, until the next separator. A file
       with no separators becomes one text cell. */
    const SEP = /^=== (page|text|abc|heading|rhythm|dance)\s*(\{.*\})?\s*$/;
    function serialize() {
      const meta = c => { const m = { ...(c.pos || {}) }; if (c.bg) m.bg = c.bg; if (c.tr) m.tr = c.tr; if (c.inst) m.inst = c.inst; if (c.nota) m.nota = c.nota; if (c.names) m.names = c.names; if (c.play) m.play = c.play; if (c.harm) m.harm = c.harm; if (c.style) m.style = c.style; if (c.mv) m.mv = c.mv; if (c.fac) m.fac = c.fac; if (c.band) m.band = c.band; return Object.keys(m).length ? ' ' + JSON.stringify(m) : ''; };
      const page = JSON.stringify({ font: fontKey, proportional });
      return `=== page ${page}\n` + cells.map(c => `=== ${c.type}${meta(c)}\n${c.text}`).join('\n') + '\n';
    }
    function parse(text) {
      const lines = text.split('\n'); const out = []; let cur = null, page = null;
      for (const line of lines) {
        const m = line.match(SEP);
        if (m && m[1] === 'page') { cur = null; try { page = JSON.parse(m[2] || '{}'); } catch (err) {} }
        else if (m) {
          cur = { id: ++seq, type: m[1], text: '' };
          if (m[2]) { try { const j = JSON.parse(m[2]); if (j.bg) cur.bg = j.bg; if (j.tr) cur.tr = j.tr; if (j.inst) cur.inst = j.inst; if (j.nota) cur.nota = j.nota; if (j.names) cur.names = j.names; if (j.play) cur.play = j.play; if (j.harm) cur.harm = j.harm; if (j.style) cur.style = j.style; if (j.mv) cur.mv = j.mv; if (j.fac) cur.fac = j.fac; if (j.band) cur.band = j.band; delete j.bg; delete j.tr; delete j.inst; delete j.nota; delete j.names; delete j.play; delete j.harm; delete j.style; delete j.band; if (Object.keys(j).length) cur.pos = j; } catch (err) {} }
          out.push(cur);
        }
        else if (cur) cur.text += (cur.text ? '\n' : '') + line;
      }
      if (!out.length) out.push({ id: ++seq, type: 'text', text: lines.join('\n') });
      for (const c of out) c.text = c.text.replace(/\n$/, '');
      return { cells: out, page };
    }
    function loadDocument(doc) {
      if (doc.page) {
        if (doc.page.font in FONTS && doc.page.font !== fontKey) { applyFont(doc.page.font); picker.value = doc.page.font; }
        if (typeof doc.page.proportional === 'boolean' && doc.page.proportional !== proportional) { proportional = doc.page.proportional; propBox.checked = proportional; localStorage.setItem('gcs-proportional', proportional ? 'on' : 'off'); }
      }
      cells = doc.cells; trash.length = 0; rebuild(); save();
    }
    document.getElementById('export').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([serialize()], { type: 'text/plain' }));
      a.download = 'grand-central-stationery.gcs.txt'; a.click(); URL.revokeObjectURL(a.href);
    });
    document.getElementById('import').addEventListener('click', () => document.getElementById('file').click());
    document.getElementById('file').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      loadDocument(parse(await f.text())); e.target.value = '';
    });
    /* ---------- share link ----------
       The whole document rides in the URL fragment: deflate (the browser's
       CompressionStream, where present) then base64url. The fragment is
       never sent to a server, so the link works for pages opened from disk
       or from any copy of this folder. */
    const b64u = { enc: bytes => { let b = ''; for (let i = 0; i < bytes.length; i += 0x8000) b += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
                   dec: str => Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)) };
    const pipe = async (bytes, Stream, kind) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new Stream(kind))).arrayBuffer());
    async function shareLink() {
      const bytes = new TextEncoder().encode(serialize());
      let tag = 't', payload = bytes;
      if (typeof CompressionStream === 'function') { try { payload = await pipe(bytes, CompressionStream, 'deflate-raw'); tag = 'z'; } catch (err) {} }
      return { url: location.href.split('#')[0] + '#gcs=' + tag + b64u.enc(payload), raw: bytes.length, packed: payload.length };
    }
    async function readShared(hash) {
      const m = hash.match(/^#gcs=([zt])([A-Za-z0-9_-]+)$/); if (!m) return null;
      let bytes = b64u.dec(m[2]);
      if (m[1] === 'z') bytes = await pipe(bytes, DecompressionStream, 'deflate-raw');
      return parse(new TextDecoder().decode(bytes));
    }
    document.getElementById('share').addEventListener('click', async () => {
      const { url, raw, packed } = await shareLink();
      const kb = n => (n / 1024).toFixed(1) + ' KB';
      try { await navigator.clipboard.writeText(url); toast(`Link copied: ${kb(url.length)} for ${kb(raw)} of text`); }
      catch (err) { prompt('Copy this link:', url); }
    });
    (async () => {
      let doc = null;
      try { doc = await readShared(location.hash); } catch (err) { console.warn('shared link not readable', err); }
      if (!doc) return;
      history.replaceState(null, '', location.pathname + location.search);
      const own = cells.map(c => c.text).join('\n').trim();
      const sample = SAMPLE.map(c => c.text).join('\n').trim();
      if (own && own !== sample && own !== doc.cells.map(c => c.text).join('\n').trim() && !confirm('Open the lesson from this link? It replaces the cells on this page (Export first to keep them).')) return;
      loadDocument(doc);
    })();
    document.getElementById('clear').addEventListener('click', () => { if (confirm('Remove all cells?')) { cells = [{ id: ++seq, type: 'text', text: '' }]; rebuild(); save(); } });

    /* ---------- go ---------- */
    applyFont(fontKey);
    rebuild();
    // Google Fonts splits Noto Music into unicode-range subsets; name the
    // accidentals so the music subset loads, then re-render everything.
    const rerenderAll = () => { primeCanvas(); for (const en of engines.values()) (en.remeasure ? en.remeasure() : en.render()); };
    if (document.fonts) {
      document.fonts.ready.then(rerenderAll).catch(() => {});
      document.fonts.load("400 100px 'Noto Music'", '\u266F\u266D\u266E').then(rerenderAll).catch(() => {});
    }
    window.GCS = { cells: () => cells, engines, addCell, present, exitPresent, present3d, exit3d, rebuild, FONTS, applyFont, serialize, parse, loadDocument, shareLink, readShared, undoDelete, reorder };
  })();
  </script>
</body>
