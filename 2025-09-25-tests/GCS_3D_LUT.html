<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Font Size Lab – 3D Table (chars × width × height)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111;
      --muted: #6b7280;
      --accent: #2563eb;
      --control-bg: rgba(255,255,255,0.9);
      --border: #e5e7eb;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Atkinson Hyperlegible Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 100vw;
      height: 60vh;
      border-bottom: 1px solid var(--border);
      box-sizing: border-box;
      padding: 2vh 2vw;
    }
    .controls {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--control-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .75rem 1rem;
      display: grid;
      gap: .5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      backdrop-filter: blur(4px);
    }
    .controls label {
      font-size: .8rem;
      color: var(--muted);
    }
    .controls input[type="range"] {
      width: 260px;
    }
    .readout {
      position: fixed;
      top: 1rem;
      left: 1rem;
      background: var(--control-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .75rem 1rem;
      font-size: .9rem;
      line-height: 1.4;
      color: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      backdrop-filter: blur(4px);
    }
    .mono { font-variant-ligatures: none; }

    .pane {
      position: absolute;
      inset: 2vh 2vw;
      border: 1px dashed var(--border);
      border-radius: 8px;
      overflow: auto;
      box-sizing: border-box;
      padding: 2vh 2vw;
      background: #fff;
    }
    .pane .output {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.1;
      margin: 0;
    }
    .pane .measure {
      position: absolute;
      visibility: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      inset: 2vh 2vw;
      padding: 0;
      line-height: 1.1;
    }
    .inputs {
      height: 40vh;
      display: grid;
      grid-template-columns: 1fr;
      grid-auto-rows: min-content;
      gap: .5rem;
      padding: 1rem 2vw;
      box-sizing: border-box;
      overflow: auto;
    }
    textarea {
      width: 100%;
      min-height: 8rem;
      resize: vertical;
      font: inherit;
      line-height: 1.3;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .75rem 1rem;
      box-sizing: border-box;
    }
    .actions {
      display: flex;
      gap: .5rem;
      align-items: center;
    }
    button {
      padding: .6rem .9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      font-size: .95rem;
    }
    th, td {
      padding: .55rem .7rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    th {
      background: #f8fafc;
      color: #111;
    }
    tr:last-child td { border-bottom: none; }
    .pill {
      display: inline-block;
      padding: .15rem .5rem;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: .8rem;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="pane" id="pane">
      <div class="output mono" id="output"></div>
      <div class="measure mono" id="measure"></div>
    </div>
  </div>

  <div class="controls">
    <label for="size">Text size (<span id="sizeVal">6.0</span> vmin)</label>
    <input id="size" type="range" min="2" max="20" step="0.1" value="6">
    <div class="actions">
      <button id="save" class="primary">Save to Table</button>
      <button id="clear">Clear Table</button>
    </div>
  </div>

  <div class="readout mono" id="readout">
    chars(eff): <span class="pill" id="charsEff">0</span><br>
    max/line: <span class="pill" id="maxCols">0</span><br>
    w×h: <span class="pill" id="wh">0×0</span>
  </div>

  <div class="inputs">
    <label for="text">Text</label>
    <textarea id="text" placeholder="Type…">C D E F G A B
C# D# F# G# A#
Db Eb Gb Ab Bb</textarea>

    <table id="grid">
      <thead>
        <tr>
          <th>Chars (bucketed)</th>
          <th>Width (bucketed)</th>
          <th>Height (bucketed)</th>
          <th>Font Size (vmin)</th>
          <th>Key</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const textEl = document.getElementById('text');
    const output = document.getElementById('output');
    const measureEl = document.getElementById('measure');
    const pane = document.getElementById('pane');
    const stage = document.getElementById('stage');

    const size = document.getElementById('size');
    const sizeVal = document.getElementById('sizeVal');

    const readout = {
      charsEff: document.getElementById('charsEff'),
      maxCols: document.getElementById('maxCols'),
      wh: document.getElementById('wh')
    };

    const gridBody = document.querySelector('#grid tbody');

    // buckets for the 3D table
    const BUCKETS = {
      chars: 10,      // round effective chars to nearest 10
      width: 50,      // round width px to nearest 50
      height: 50      // round height px to nearest 50
    };
    const table3D = new Map(); // key: "c|w|h" -> {fontVmin}

    function roundToBucket(n, bucket) {
      return Math.round(n / bucket) * bucket;
    }

    // measure 1ch width in the output context
    function chWidth() {
      const probe = document.createElement('span');
      probe.textContent = '0';
      probe.style.position = 'absolute';
      probe.style.visibility = 'hidden';
      probe.style.whiteSpace = 'pre';
      probe.style.font = getComputedStyle(output).font;
      document.body.appendChild(probe);
      const w = probe.getBoundingClientRect().width || 1;
      probe.remove();
      return w;
    }

    function computeMaxCols() {
      const cw = chWidth();
      const innerWidth = pane.clientWidth - parseFloat(getComputedStyle(pane).paddingLeft) - parseFloat(getComputedStyle(pane).paddingRight);
      return Math.max(1, Math.floor(innerWidth / cw));
    }

    // Effective char count: plain chars + newlineCount * (maxCols/2)
    function effectiveCharCount(str, maxCols) {
      const nl = (str.match(/\n/g) || []).length;
      const plain = str.replace(/\n/g, '').length;
      const bonus = Math.floor(maxCols / 2) * nl;
      return plain + bonus;
    }

    function updateOutputFont() {
      const v = parseFloat(size.value);
      output.style.fontSize = v + 'vmin';
      measureEl.style.fontSize = v + 'vmin';
      sizeVal.textContent = v.toFixed(1);
    }

    function render() {
      const t = textEl.value;
      output.textContent = t;      // simple (no coloring here)
      measureEl.textContent = t;   // same content for measurement
      updateReadout();
    }

    function updateReadout() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const maxCols = computeMaxCols();
      const charsEff = effectiveCharCount(textEl.value, maxCols);

      readout.charsEff.textContent = String(charsEff);
      readout.maxCols.textContent = String(maxCols);
      readout.wh.textContent = `${w}×${h}`;
    }

    function currentBucketKey() {
      const w = roundToBucket(window.innerWidth, BUCKETS.width);
      const h = roundToBucket(window.innerHeight, BUCKETS.height);
      const maxCols = computeMaxCols();
      const charsEff = effectiveCharCount(textEl.value, maxCols);
      const c = roundToBucket(charsEff, BUCKETS.chars);
      const fontVmin = parseFloat(size.value).toFixed(2);
      const key = `${c}|${w}|${h}`;
      return { key, c, w, h, fontVmin };
    }

    function addRow(record) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${record.c}</td>
        <td>${record.w}</td>
        <td>${record.h}</td>
        <td>${record.fontVmin}</td>
        <td><code>${record.key}</code></td>
      `;
      gridBody.appendChild(tr);
    }

    // Save current combo (chars, width, height) -> font size
    document.getElementById('save').addEventListener('click', () => {
      const rec = currentBucketKey();
      if (!table3D.has(rec.key)) {
        table3D.set(rec.key, { fontVmin: rec.fontVmin });
        addRow(rec);
      } else {
        // update existing row value (simple approach: append a new row)
        table3D.set(rec.key, { fontVmin: rec.fontVmin });
        addRow(rec);
      }
    });

    document.getElementById('clear').addEventListener('click', () => {
      table3D.clear();
      gridBody.innerHTML = '';
    });

    // React to changes
    size.addEventListener('input', () => {
      updateOutputFont();
      updateReadout();
    });
    textEl.addEventListener('input', () => {
      render();
    });

    // Keep metrics fresh on resize
    const onResize = () => {
      updateReadout();
    };
    window.addEventListener('resize', onResize);

    // Init
    updateOutputFont();
    render();
  </script>
</body>
</html>
