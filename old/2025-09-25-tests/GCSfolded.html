<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grand Central Stationery – ChromaNotes Shadow Layer v2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      font-family: 'Atkinson Hyperlegible Mono', monospace;
      background: #fff;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .shadow, .inputbox {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      padding: 2vh;
      box-sizing: border-box;
      font-family: 'Atkinson Hyperlegible Mono', monospace;
      font-optical-sizing: auto;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
      line-height: 1.1;
      font-size: clamp(4vmin, 100vmin, 100vmin);
    }
    .shadow {
      color: #222;
      z-index: 1;
      pointer-events: none;
    }
    $1
    .measure {
      position: absolute;
      visibility: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      inset: 0;
      padding: 2vh;
      box-sizing: border-box;
      line-height: 1.1;
      font-family: 'Atkinson Hyperlegible Mono', monospace;
      font-optical-sizing: auto;
    }
.inputbox {
      color: transparent;
      caret-color: #aaa;
      background: transparent;
      z-index: 2;
      border: none;
      outline: none;
      resize: none;
    }
  </style>
</head>
<body>
  <div class="container">
    $1
    <div class="measure" aria-hidden="true"></div>
    <textarea class="inputbox"
      aria-label="Note input"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"></textarea>
  </div>
  <script>
    (() => {
      const chromaNotesColors = {
        'C': '#e72829', 'C#': '#ef5523', 'Db': '#ef5523',
        'D': '#f39322', 'D#': '#ffd259', 'Eb': '#ffd259',
        'E': '#f2e716', 'E#': '#69b944', 'Fb': '#f2e716',
        'F': '#69b944', 'F#': '#53cf84', 'Gb': '#53cf84',
        'G': '#019696', 'G#': '#087fca', 'Ab': '#087fca',
        'A': '#79569f', 'A#': '#9f5a8f', 'Bb': '#9f5a8f',
        'B': '#FF77A9', 'Cb': '#ec6ca4', 'B#': '#e72829'
      };

      $1
      const measure = document.querySelector('.measure');

      function getChWidth(el) {
        const probe = document.createElement('span');
        probe.style.position = 'absolute';
        probe.style.visibility = 'hidden';
        probe.style.whiteSpace = 'pre';
        probe.textContent = '0';
        probe.style.font = getComputedStyle(el).font;
        el.appendChild(probe);
        const w = probe.getBoundingClientRect().width || 1;
        probe.remove();
        return w;
      }

      function pxLeftOnCurrentVisualLine(textarea, mirrorEl) {
        const caret = textarea.selectionStart;
        const value = textarea.value;
        const prevNL = value.lastIndexOf('\n', Math.max(0, caret - 1));
        const lineStart = prevNL + 1;
        const lineSoFar = value.slice(lineStart, caret);

        mirrorEl.textContent = lineSoFar;
        const usedPx = mirrorEl.getBoundingClientRect().width;
        const maxPx  = shadow.clientWidth;
        return Math.max(0, maxPx - usedPx);
      }

      function missingCharsOnEnter(textarea, mirrorEl, assumeMonospace = true) {
        const px = pxLeftOnCurrentVisualLine(textarea, mirrorEl);
        if (assumeMonospace) {
          const ch = getChWidth(shadow);
          return Math.floor(px / ch);
        } else {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const cs = getComputedStyle(shadow);
          ctx.font = `${cs.fontStyle} ${cs.fontVariant} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
          const avg = ctx.measureText('N').width || 8;
          return Math.max(0, Math.floor(px / avg));
        }
      }


      function escapeHTML(str) {
        return str.replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;");
      }

      function renderColouredText(text) {
        const noteRegex = /([A-G](?:#|b)?)/g;
        const escaped = escapeHTML(text);
        return escaped.replace(noteRegex, match => {
          const color = chromaNotesColors[match];
          return color ? `<span style="color:${color};">${match}</span>` : match;
        });
      }

      function update() {
        const text = input.value;
        shadow.innerHTML = renderColouredText(text);
        input.style.padding = getComputedStyle(shadow).padding;
        input.style.boxSizing = getComputedStyle(shadow).boxSizing;
      }

      let resizeTimeout;
      $1

      input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const missing = missingCharsOnEnter(input, measure, true);
        console.log('Missing chars on this visual line at Enter:', missing);
      });

      const ro = new ResizeObserver(() => {
        const missing = missingCharsOnEnter(input, measure, true);
        console.log('After resize, missing chars now:', missing);
      });
      ro.observe(shadow);

      input.addEventListener('scroll', () => {
        shadow.scrollTop = input.scrollTop;
        shadow.scrollLeft = input.scrollLeft;
      });

      input.value = "C D E F G A B\nC# D# F# G# A#\nDb Eb Gb Ab Bb";
      update();
    })();
  </script>
</body>
</html>
